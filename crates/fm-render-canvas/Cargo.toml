[package]
name = "fm-render-canvas"
description = "HTML5 Canvas renderer for FrankenMermaid diagram IR"
keywords = ["canvas", "render", "diagram", "mermaid", "wasm"]
categories = ["wasm", "visualization"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
fm-core.workspace = true
fm-layout.workspace = true

[dev-dependencies]
sha2 = "0.11"
# Tests parse REAL mermaid source rather than hand-building IR. A hand-built fixture is how
# c0d7ed3a's kanban fix came to pass its own tests while being unreachable from parser output
# (bd-u3fo); a renderer test that never sees what the parser actually emits can certify a path
# nothing reaches. No cycle: fm-parser does not depend on this crate.
fm-parser.workspace = true
