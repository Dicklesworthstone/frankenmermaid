[package]
name = "frankenmermaid-cli"
description = "CLI tool for parsing, validating, and rendering Mermaid diagrams"
keywords = ["cli", "mermaid", "diagram", "svg", "render"]
categories = ["command-line-utilities", "visualization"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# Benches are declared explicitly below, not auto-discovered (bd-9cma).
# `benches/corpus_generators.rs` is a SHARED SOURCE compiled into both `pipeline_bench` and
# `tests/bench_corpus_parity.rs` via `#[path]`, so that the parity test checks the very generators
# the bench runs. With autodiscovery on, cargo also built it as an empty extra bench target.
# Adding a real bench now means adding a `[[bench]]` section for it.
autobenches = false
# This package ships three binaries, so a bare `cargo run -p frankenmermaid-cli` cannot pick one and
# errors out. CI relies on exactly that form (`cargo run -p … -- determinism-manifest`), so name the
# canonical binary here rather than adding `--bin` at every call site (bd-7l56). `frankenmermaid`, not
# the transitional `fm-cli` alias below.
default-run = "frankenmermaid"

[[bin]]
name = "frankenmermaid"
path = "src/main.rs"

# Keep fm-cli as alias for backwards compatibility during transition
[[bin]]
name = "fm-cli"
path = "src/main.rs"

[[bin]]
name = "evidence"
path = "src/bin/evidence.rs"

[features]
default = []
# Optional features for extended functionality
watch = ["dep:notify"]
serve = ["dep:tiny_http"]
png = ["dep:resvg", "dep:usvg"]
fnx-integration = ["fm-layout/fnx-integration"]
fnx-experimental-directed = ["fm-layout/fnx-experimental-directed"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm = "0.29"
fm-core.workspace = true
fm-layout.workspace = true
fm-parser.workspace = true
fm-render-svg.workspace = true
fm-render-term.workspace = true
# Shipped dependency, not just bench scaffolding: `render-batch` runs whole diagram pipelines
# concurrently. The incumbent renders on one JavaScript main thread and has no answer to this.
rayon = "1.12.0"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.34"
sha2 = "0.11"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
toml = "1.1"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }

# Optional dependencies
notify = { version = "8.2", optional = true }
tiny_http = { version = "0.12", optional = true }
resvg = { version = "0.47", optional = true, default-features = false }
usvg = { version = "0.47", optional = true, default-features = false }

# Native global allocator. The whole pipeline (parse interning, layout point/index vecs,
# render output buffer) is allocation-heavy; a measured full-pipeline profile put glibc
# malloc/free/consolidate at ~9% of the wide render. mimalloc's segregated free lists
# (no consolidation pass) cut a deterministic ~9-10% of pipeline instructions/time. Native
# only — the wasm build (fm-wasm, a separate crate) keeps its own allocator.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.25"
fm-render-canvas.workspace = true

[[bench]]
name = "pipeline_bench"
harness = false
