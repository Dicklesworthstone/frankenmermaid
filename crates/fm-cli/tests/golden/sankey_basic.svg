<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 628.675 474" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" role="graphics-document document" aria-roledescription="sankey" data-nodes="7" data-edges="8" data-type="sankey" data-detail-tier="rich"><title>sankey diagram</title><desc>A diagram with 7 nodes and 8 edges. Flowing top to bottom. Key nodes: Source A, Process X, Process Y. Key relationships: Source A points to Process X with label: 100; Source A points to Process Y with label: 50; Source B points to Process X with label: 75. Layout spans 581 by 426 units with 7 rendered node boxes and 8 routed edge paths.</desc><style>svg{font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size: 15px;font-weight: 500;}svg{--fm-bg: #fafbfc;--fm-text-color: #1a1a2e;--fm-node-fill: #ffffff;--fm-node-stroke: #e2e8f0;--fm-edge-color: #94a3b8;--fm-cluster-fill: rgba(241,245,249,0.6);--fm-cluster-stroke: #cbd5e1;--fm-accent-1: #6366f1;--fm-accent-3: #06b6d4;--fm-accent-4: #8b5cf6;--fm-accent-5: #f59e0b;--fm-accent-6: #ec4899;--fm-accent-7: #10b981;--fm-accent-8: #f43f5e;}svg{--fm-edge-muted:var(--fm-edge-color);--fm-edge-label-bg:var(--fm-bg);--fm-edge-label-border:none;--fm-edge-label-text:var(--fm-text-color);--fm-surface-shadow:rgba(15,23,42,.06)}svg{shape-rendering:geometricPrecision;background:var(--fm-bg)}.fm-node{isolation:isolate;fill:var(--fm-node-fill);--fm-node-accent:var(--fm-node-stroke);--fm-node-hover-accent:var(--fm-edge-color)}.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon{stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision;filter:drop-shadow(0 1px 2px rgba(15,23,42,.06));transition:fill 150ms ease,stroke 150ms ease,filter 150ms ease}.fm-node.fm-node-user-mindmap-no-border :where(rect,path,polygon){stroke:none}.fm-node line{stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke}.fm-node text{text-rendering:optimizeLegibility;font-kerning:normal}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke:var(--fm-node-hover-accent);filter:drop-shadow(0 2px 4px rgba(15,23,42,.10));}.fm-node-accent-3{--fm-node-hover-accent:var(--fm-accent-3)}.fm-node-accent-4{--fm-node-hover-accent:var(--fm-accent-4)}.fm-node-accent-5{--fm-node-hover-accent:var(--fm-accent-5)}.fm-node-accent-6{--fm-node-hover-accent:var(--fm-accent-6)}.fm-node-accent-7{--fm-node-hover-accent:var(--fm-accent-7)}.fm-node-accent-8{--fm-node-hover-accent:var(--fm-accent-8)}.fm-edge{fill:none;stroke:var(--fm-edge-color);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;paint-order:stroke;transition:stroke 150ms ease,opacity 150ms ease,stroke-width 150ms ease;cursor:default}.fm-edge:hover{stroke:var(--fm-accent-1);opacity:1}.fm-edge-solid{stroke-dasharray:none}.fm-edge-back{stroke:var(--fm-edge-muted);opacity:.8;stroke-dasharray:4 4}marker#arrow-end path{fill:var(--fm-edge-color);stroke:none;transition:fill 150ms ease}.fm-edge:hover~marker#arrow-end path{fill:var(--fm-accent-1)}.fm-label{fill:var(--fm-text-color)}@media (prefers-reduced-motion:reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition:none;transform:none}}.fm-node:focus-visible{outline:2px solid var(--fm-accent-1);outline-offset:3px}.fm-edge-labeled > rect{fill: var(--fm-edge-label-bg);stroke: var(--fm-edge-label-border);stroke-width: 0.75;rx: 4px;ry: 4px;}.edge-label{fill: var(--fm-edge-label-text);font-weight: 400;text-rendering: optimizeLegibility;}/* High contrast mode support */ @media (prefers-contrast: more){svg,:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node-semantic{--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;}.fm-node-semantic text{fill: #000000;}.fm-node{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{svg{--fm-bg: #fff !important;--fm-node-fill: #fff !important;--fm-node-stroke: #111 !important;--fm-edge-color: #111 !important;--fm-edge-muted: #111 !important;--fm-edge-label-bg: #fff !important;--fm-edge-label-text: #111 !important;--fm-text-color: #111 !important;background: #fff !important;}.fm-node text,.fm-edge-labeled text,.fm-cluster-label{fill: #111;}.fm-edge-labeled > rect{fill: #fff !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-node line,.fm-edge{stroke: #111;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}.fm-node-semantic{--fm-node-fill: #fff !important;--fm-node-stroke: #111 !important;}}</style><defs><marker id="arrow-end" refX="8" refY="3.50" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 8 7" markerWidth="32" markerHeight="28"><path d="M0 0 L8 3.50 L0 7 L2 3.50 Z" fill="#94a3b8"/></marker></defs><g class="fm-band fm-band-column"><rect x="32" y="84.71" width="170.57" height="304.57" rx="10" fill="rgba(241,245,249,0.6)" stroke="#cbd5e1" stroke-width="1"/></g><g class="fm-band fm-band-column"><rect x="226.57" y="32" width="178.82" height="410" rx="10" fill="rgba(241,245,249,0.6)" stroke="#cbd5e1" stroke-width="1"/></g><g class="fm-band fm-band-column"><rect x="429.40" y="84.71" width="167.27" height