<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2723.1997 397" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" role="graphics-document document" aria-roledescription="flowchart-v2" data-nodes="13" data-edges="10" data-type="flowchart" data-detail-tier="rich"><title>flowchart diagram</title><desc>A flowchart diagram with 13 nodes and 10 edges. Flowing left to right. Key nodes: Rectangle, Rounded, Stadium. Key relationships: Rectangle points to Rounded; Rounded points to Stadium; Stadium points to Subroutine. Layout spans 2643 by 317 units with 13 rendered node boxes and 10 routed edge paths.</desc><style>:root{--fm-bg: #fafbfc;--fm-text-color: #1a1a2e;--fm-node-fill: #ffffff;--fm-node-stroke: #e2e8f0;--fm-edge-color: #94a3b8;--fm-cluster-fill: rgba(241,245,249,0.6);--fm-cluster-stroke: #cbd5e1;--fm-accent-1: #6366f1;--fm-accent-2: #3b82f6;--fm-accent-3: #06b6d4;--fm-accent-4: #8b5cf6;--fm-accent-6: #ec4899;--fm-accent-7: #10b981;--fm-accent-8: #f43f5e;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}:root{--fm-edge-muted: var(--fm-cluster-stroke);--fm-edge-label-bg: var(--fm-bg);--fm-edge-label-border: var(--fm-cluster-stroke);--fm-edge-label-text: var(--fm-text-color);--fm-surface-shadow: rgba(15,23,42,0.1);}svg{shape-rendering: geometricPrecision;background: var(--fm-bg);background-image:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--fm-accent-1) 4%,transparent) 0%,transparent 50%),linear-gradient(180deg,var(--fm-bg) 0%,color-mix(in srgb,var(--fm-bg) 96%,var(--fm-node-stroke) 4%) 100%);}.fm-node{isolation: isolate;--fm-node-accent: var(--fm-node-stroke);--fm-node-hover-accent: var(--fm-edge-color);}.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon{fill: var(--fm-node-fill);stroke: var(--fm-node-accent);stroke-width: 1.6;vector-effect: non-scaling-stroke;shape-rendering: geometricPrecision;filter: drop-shadow(0 2px 8px rgba(0,0,0,0.10)) drop-shadow(0 1px 3px rgba(0,0,0,0.06));transition: fill 200ms ease,stroke 200ms ease,filter 200ms ease;}.fm-node.fm-node-user-mindmap-no-border rect,.fm-node.fm-node-user-mindmap-no-border path,.fm-node.fm-node-user-mindmap-no-border polygon{stroke: none;}.fm-node line{stroke: var(--fm-node-accent);stroke-width: 1.5;vector-effect: non-scaling-stroke;}.fm-node text{fill: var(--fm-text-color);font-weight: 600;letter-spacing: -0.02em;text-rendering: optimizeLegibility;font-feature-settings: "kern" 1,"liga" 1,"calt" 1;}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke: var(--fm-node-hover-accent);filter: drop-shadow(0 8px 20px rgba(0,0,0,0.14)) drop-shadow(0 3px 8px rgba(0,0,0,0.08));}.fm-node-accent-1{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-1) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-1);}.fm-node-accent-2{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-2) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-2);}.fm-node-accent-3{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-3) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-3);}.fm-node-accent-4{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-4) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-4);}.fm-node-accent-6{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-6) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-6);}.fm-node-accent-7{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-7) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-7);}.fm-node-accent-8{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-8) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-8);}.fm-node.fm-node-shape-note path,.fm-node.fm-node-shape-note rect{fill: var(--fm-node-fill);fill: color-mix(in srgb,#fef3c7 40%,var(--fm-node-fill));}.fm-node.fm-node-shape-cloud path{fill: var(--fm-node-fill);fill: color-mix(in srgb,var(--fm-accent-2) 15%,var(--fm-node-fill));}.fm-node.fm-node-shape-cylinder path{fill: var(--fm-node-fill);fill: color-mix(in srgb,var(--fm-accent-1) 12%,var(--fm-node-fill));}.fm-node.fm-node-shape-star path,.fm-node.fm-node-shape-pentagon path{stroke-width: 1.8;}.fm-edge{fill: none;stroke: var(--fm-edge-color);stroke-linecap: round;stroke-linejoin: round;vector-effect: non-scaling-stroke;paint-order: stroke;transition: stroke 200ms ease,opacity 200ms ease,stroke-width 200ms ease;cursor: default;}.fm-edge:hover{stroke: var(--fm-accent-1);stroke-width: 2.5;opacity: 1;}.fm-edge-solid{stroke-dasharray: none;}.fm-edge-back{stroke: var(--fm-edge-muted);opacity: 0.8;stroke-dasharray: 4 4;}marker#arrow-end path{fill: var(--fm-edge-color);stroke: none;transition: fill 200ms ease;}.fm-edge:hover ~ marker#arrow-end path{fill: var(--fm-accent-1);}.fm-label{fill: var(--fm-text-color);}@media (prefers-reduced-motion: reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition: none;transform: none;}}.fm-node:focus-visible{outline: 2px solid var(--fm-accent-1);outline-offset: 3px;}/* High contrast mode support */ @media (prefers-contrast: more){:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{.fm-node text,.fm-edge-labeled text,.fm-cluster-label{font-size: 8.0px !important;fill: #111 !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-edge{stroke: #111 !important;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}}</style><defs><marker id="arrow-end" markerWidth="8" markerHeight="7" refX="8" refY="3.50" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.50 L0 7 L2 3.50 Z" fill="#94a3b8"/></marker></defs><g id="fm-edge-0" class="fm-edge" data-fm-edge-id="0" role="graphics-symbol" tabindex="0"><path d="M230 198.50 C245 198.50,275 198.50,290 198.50 C290 216.81,290 253.44,290 271.75 C305 271.75,335 271.75,350 271.75" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="0" marker-end="url(#arrow-end)"/><title>Rectangle points to Rounded</title></g><g id="fm-edge-1" class="fm-edge" data-fm-edge-id="1" role="graphics-symbol" tabindex="0"><path d="M479.75 271.75 L599.75 271.75" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="1" marker-end="url(#arrow-end)"/><title>Rounded points to Stadium</title></g><g id="fm-edge-2" class="fm-edge" data-fm-edge-id="2" role="graphics-symbol" tabindex="0"><path d="M722.90 271.75 L849.50 271.75" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="2" marker-end="url(#arrow-end)"/><title>Stadium points to Subroutine</title></g><g id="fm-edge-3" class="fm-edge" data-fm-edge-id="3" role="graphics-symbol" tabindex="0"><path d="M476.45 125.2