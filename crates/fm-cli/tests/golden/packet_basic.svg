<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1208 449" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" role="img" data-nodes="8" data-edges="0" data-type="packet-beta" data-detail-tier="rich"><title>packet-beta diagram</title><desc>A diagram with 8 nodes and 0 edges. flowing top to bottom. Key nodes: Source Port, Destination Port, Sequence Number.. Layout spans 1128 by 369 units with 8 rendered node boxes and 0 routed edge paths.</desc><style>:root{--fm-bg: #fafbfc;--fm-text-color: #1a1a2e;--fm-node-fill: #ffffff;--fm-node-stroke: #e2e8f0;--fm-edge-color: #94a3b8;--fm-cluster-fill: rgba(241,245,249,0.6);--fm-cluster-stroke: #cbd5e1;--fm-accent-1: #6366f1;--fm-accent-2: #3b82f6;--fm-accent-3: #06b6d4;--fm-accent-4: #8b5cf6;--fm-accent-5: #f59e0b;--fm-accent-6: #ec4899;--fm-accent-7: #10b981;--fm-accent-8: #f43f5e;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}:root{--fm-edge-muted: var(--fm-cluster-stroke);--fm-edge-label-bg: var(--fm-bg);--fm-edge-label-border: var(--fm-cluster-stroke);--fm-edge-label-text: var(--fm-text-color);--fm-surface-shadow: rgba(15,23,42,0.1);}svg{shape-rendering: geometricPrecision;background: var(--fm-bg);background-image:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--fm-accent-1) 4%,transparent) 0%,transparent 50%),linear-gradient(180deg,var(--fm-bg) 0%,color-mix(in srgb,var(--fm-bg) 96%,var(--fm-node-stroke) 4%) 100%);}.fm-node{isolation: isolate;--fm-node-accent: var(--fm-node-stroke);--fm-node-hover-accent: var(--fm-edge-color);}.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon{fill: var(--fm-node-fill);stroke: var(--fm-node-accent);stroke-width: 1.6;vector-effect: non-scaling-stroke;shape-rendering: geometricPrecision;filter: drop-shadow(0 2px 8px rgba(0,0,0,0.10)) drop-shadow(0 1px 3px rgba(0,0,0,0.06));transition: fill 200ms ease,stroke 200ms ease,filter 200ms ease;}.fm-node.fm-node-user-mindmap-no-border rect,.fm-node.fm-node-user-mindmap-no-border path,.fm-node.fm-node-user-mindmap-no-border polygon{stroke: none;}.fm-node line{stroke: var(--fm-node-accent);stroke-width: 1.5;vector-effect: non-scaling-stroke;}.fm-node text{fill: var(--fm-text-color);font-weight: 600;letter-spacing: -0.02em;text-rendering: optimizeLegibility;font-feature-settings: "kern" 1,"liga" 1,"calt" 1;}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke: var(--fm-node-hover-accent);filter: drop-shadow(0 8px 20px rgba(0,0,0,0.14)) drop-shadow(0 3px 8px rgba(0,0,0,0.08));}.fm-node-accent-1{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-1) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-1);}.fm-node-accent-2{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-2) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-2);}.fm-node-accent-3{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-3) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-3);}.fm-node-accent-4{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-4) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-4);}.fm-node-accent-5{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-5) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-5);}.fm-node-accent-6{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-6) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-6);}.fm-node-accent-7{--fm-node-accen