<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305.62314 1086.1929" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" role="graphics-document document" aria-roledescription="c4" data-nodes="4" data-edges="4" data-type="C4Component" data-detail-tier="rich" class="fm-edge-label-mask-3d7e3e199244b27c"><title>C4Component diagram</title><desc>A diagram with 4 nodes and 4 edges. Flowing top to bottom. Key nodes: Single-Page App, Sign In Controller, Security Component. Key relationships: Single-Page App points to Sign In Controller with label: Makes API calls to; Sign In Controller points to Security Component with label: Uses; Security Component points to Credential Store with label: Reads credentials from. Layout spans 258 by 1001 units with 4 rendered node boxes and 4 routed edge paths.</desc><style>:root{--fm-bg: #fafbfc;--fm-text-color: #1a1a2e;--fm-node-fill: #ffffff;--fm-node-stroke: #e2e8f0;--fm-edge-color: #94a3b8;--fm-cluster-fill: rgba(241,245,249,0.6);--fm-cluster-stroke: #cbd5e1;--fm-accent-1: #6366f1;--fm-accent-2: #3b82f6;--fm-accent-4: #8b5cf6;--fm-accent-6: #ec4899;--fm-accent-7: #10b981;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}:root{--fm-edge-muted: var(--fm-cluster-stroke);--fm-edge-label-bg: var(--fm-bg);--fm-edge-label-border: var(--fm-cluster-stroke);--fm-edge-label-text: var(--fm-text-color);--fm-surface-shadow: rgba(15,23,42,0.1);}svg{shape-rendering: geometricPrecision;background: var(--fm-bg);background-image:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--fm-accent-1) 4%,transparent) 0%,transparent 50%),linear-gradient(180deg,var(--fm-bg) 0%,color-mix(in srgb,var(--fm-bg) 96%,var(--fm-node-stroke) 4%) 100%);}.fm-node{isolation: is