<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 308.8 577" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" role="graphics-document document" aria-roledescription="stateDiagram" data-nodes="3" data-edges="3" data-type="state" data-detail-tier="normal"><title>state diagram</title><desc>A state diagram with 3 nodes and 3 edges. Flowing top to bottom. Key nodes: __state_start, Idle, Running. Key relationships: __state_start points to Idle; Idle points to Running with label: start; Running points to Idle with label: stop. Layout spans 229 by 497 units with 3 rendered node boxes and 3 routed edge paths.</desc><style>:root{--fm-bg: #fafbfc;--fm-text-color: #1a1a2e;--fm-node-fill: #ffffff;--fm-node-stroke: #e2e8f0;--fm-edge-color: #94a3b8;--fm-cluster-fill: rgba(241,245,249,0.6);--fm-cluster-stroke: #cbd5e1;--fm-accent-1: #6366f1;--fm-accent-4: #8b5cf6;--fm-accent-5: #f59e0b;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}:root{--fm-edge-muted: var(--fm-cluster-stroke);--fm-edge-label-bg: var(--fm-bg);--fm-edge-label-border: var(--fm-cluster-stroke);--fm-edge-label-text: var(--fm-text-color);--fm-surface-shadow: rgba(15,23,42,0.1);}svg{shape-rendering: geometricPrecision;background: var(--fm-bg);background-image:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--fm-accent-1) 4%,transparent) 0%,transparent 50%),linear-gradient(180deg,var(--fm-bg) 0%,color-mix(in srgb,var(--fm-bg) 96%,var(--fm-node-stroke) 4%) 100%);}.fm-node{isolation: isolate;--fm-node-accent: var(--fm-node-stroke);--fm-node-hover-accent: var(--fm-edge-color);}.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon{fill: var(--fm-node-fill);stroke: var(--fm-node-accent);stroke-width: 1.6;vector-effect: non-scaling-stroke;shape-rendering: geometricPrecision;filter: drop-shadow(0 2px 8px rgba(0,0,0,0.10)) drop-shadow(0 1px 3px rgba(0,0,0,0.06));transition: fill 200ms ease,stroke 200ms ease,filter 200ms ease;}.fm-node.fm-node-user-mindmap-no-border rect,.fm-node.fm-node-user-mindmap-no-border path,.fm-node.fm-node-user-mindmap-no-border polygon{stroke: none;}.fm-node line{stroke: var(--fm-node-accent);stroke-width: 1.5;vector-effect: non-scaling-stroke;}.fm-node text{fill: var(--fm-text-color);font-weight: 600;letter-spacing: -0.02em;text-rendering: optimizeLegibility;font-feature-settings: "kern" 1,"liga" 1,"calt" 1;}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke: var(--fm-node-hover-accent);filter: drop-shadow(0 8px 20px rgba(0,0,0,0.14)) drop-shadow(0 3px 8px rgba(0,0,0,0.08));}.fm-node-accent-4{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-4) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-4);}.fm-node-accent-5{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-5) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-5);}.fm-edge{fill: none;stroke: var(--fm-edge-color);stroke-linecap: round;stroke-linejoin: round;vector-effect: non-scaling-stroke;paint-order: stroke;transition: stroke 200ms ease,opacity 200ms ease,stroke-width 200ms ease;cursor: default;}.fm-edge:hover{stroke: var(--fm-accent-1);stroke-width: 2.5;opacity: 1;}.fm-edge-solid{stroke-dasharray: none;}.fm-edge-back{stroke: var(--fm-edge-muted);opacity: 0.8;stroke-dasharray: 4 4;}marker#arrow-end path{fill: var(--fm-edge-color);stroke: none;transition: fill 200ms ease;}.fm-edge:hover ~ marker#arrow-end path{fill: var(--fm-accent-1);}marker#arrow-open path{stroke: var(--fm-edge-muted);fill: none;stroke-width: 1.8;transition: stroke 200ms ease;}.fm-label{fill: var(--fm-text-color);}@media (prefers-reduced-motion: reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition: none;transform: none;}}.fm-node:focus-visible{outline: 2px solid var(--fm-accent-1);outline-offset: 3px;}.fm-edge-labeled > rect{fill: var(--fm-edge-label-bg);stroke: var(--fm-edge-label-border);stroke-width: 0.75;rx: 6px;ry: 6px;}@supports (backdrop-filter: blur(4px)){.fm-edge-labeled > rect{fill: color-mix(in srgb,var(--fm-edge-label-bg) 85%,transparent);backdrop-filter: blur(8px);}}.edge-label{fill: var(--fm-edge-label-text);font-weight: 600;font-size: 0.88em;letter-spacing: -0.01em;text-rendering: optimizeLegibility;}/* High contrast mode support */ @media (prefers-contrast: more){:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{.fm-node text,.fm-edge-labeled text,.fm-cluster-label{font-size: 8.0px !important;fill: #111 !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-edge{stroke: #111 !important;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}}</style><defs><marker id="arrow-end" markerWidth="8" markerHeight="7" refX="8" refY="3.50" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.50 L0 7 L2 3.50 Z" fill="#94a3b8"/></marker><marker id="arrow-open" markerWidth="8" markerHeight="7" refX="7" refY="3.50" orient="auto" markerUnits="strokeWidth"><path d="M0 0.50 L7 3.50 L0 6.50" fill="none" stroke="#94a3b8" stroke-width="1.20"/></marker></defs><g id="fm-edge-0" class="fm-edge" data-fm-edge-id="0" role="graphics-symbol" tabindex="0"><path d="M102 112 C102 127,102 157,102 172 C112 172,132 172,142 172 C142 187,142 217,142 232" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="0" marker-end="url(#arrow-end)"/><title>__state_start points to Idle</title></g><g id="fm-edge-1" class="fm-edge-labeled" data-fm-edge-id="1" role="graphics-symbol" tabindex="0"><path d="M136 298.50 C136 313.50,136 343.50,136 358.50 C139.10 358.50,145.30 358.50,148.40 358.50 C148.40 373.50,148.40 403.50,148.40 418.50" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="1" marker-end="url(#arrow-end)"/><rect x="109.45" y="336.35" width="65.50" height="26.30" fill="#fafbfc" stroke="#cbd5e1" stroke-width="0.75" rx="6" ry="6"/><text x="142.20" y="353.58" text-anchor="middle" font-size="12.30" fill="#1a1a2e" class="edge-label">start</text><title>Idle points to Running with label: start</title></g><g id="fm-edge-2" class="fm-edge-labeled" data-fm-edge-id="2" role="graphics-symbol" tabindex="0"><path d="M160.40 418.50 C160.40 403.50,160.40 373.50,160.40 358.50 C157.30 358.50,151.10 358.50,148 358.50 C148 343.50,148 313.50,148 298.50" stroke-width="1.80" class="fm-edge fm-edge-back" data-fm-edge-id="2" marker-end="url(#arrow-open)" stroke-dasharray="4,4"/><rect x="125.20" y="336.35" width="58" height="26.30" fill="#fafbfc" stroke="#cbd5e1" stroke-width="0.75" rx="6" ry="6"/><text x="154.20" y="353.58" text-anchor="middle" font-size="12.30" fill="#1a1a2e" class="edge-label">stop</text><title>Running points to Idle with label: stop</title></g><g id="fm-node-state-start-0" class="fm-node fm-node-accent-4 fm-node-shape-filled-circle" data-id="__state_start" role="graphics-symbol" aria-label="" tabindex="0"><circle cx="102" cy="102" r="10" fill="#e2e8f0"/><text x="102" y="106.60" text-anchor="middle" font-size="13.80" fill="#1a1a2e"></text><title>Node: __state_start, filled circle</title></g><g id="fm-node-idle-1" class="fm-node fm-node-accent-4 fm-node-shape-rect" data-id="Idle" role="graphics-symbol" aria-label="Idle" tabindex="0"><rect x="92" y="232" width="100" height="66.50" fill="#ffffff" rx="5.50"/><text x="142" y="269.85" text-anchor="middle" font-size="13.80" fill="#1a1a2e">Idle</text><title>Node: Idle, rectangle</title></g><g id="fm-node-running-2" class="fm-node fm-node-accent-5 fm-node-shape-rect" data-id="Running" role="graphics-symbol" aria-label="Running" tabindex="0"><rect x="92" y="418.50" width="124.80" height="66.50" fill="#ffffff" rx="5.50"/><text x="154.40" y="456.35" text-anchor="middle" font-size="13.80" fill="#1a1a2e">Running</text><title>Node: Running, rectangle</title></g></svg>
