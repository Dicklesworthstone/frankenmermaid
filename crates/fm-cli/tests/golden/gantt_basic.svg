ght="7" refX="8" refY="3.50" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.50 L0 7 L2 3.50 Z" fill="#94a3b8"/></marker></defs><path d="M236 162.25 L236 243.85" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#fm-gantt-arrowhead)" class="fm-gantt-dependency"/></svg>
