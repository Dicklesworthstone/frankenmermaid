<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 617" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" role="graphics-document document" aria-roledescription="venn" data-nodes="6" data-edges="0" data-type="venn-beta" data-detail-tier="rich"><title>venn-beta diagram</title><desc>A diagram with 6 nodes and 0 edges. Flowing top to bottom. Key nodes: Frontend, Backend team, Ops. Layout spans 800 by 500 units with 6 rendered node boxes and 0 routed edge paths.</desc><style>svg{--fm-bg: #fafbfc;--fm-text-color: #1a1a2e;--fm-node-fill: #ffffff;--fm-node-stroke: #e2e8f0;--fm-edge-color: #94a3b8;--fm-cluster-fill: rgba(241,245,249,0.6);--fm-cluster-stroke: #cbd5e1;--fm-accent-1: #6366f1;--fm-accent-5: #f59e0b;--fm-accent-6: #ec4899;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}svg{--fm-edge-muted:var(--fm-cluster-stroke);--fm-edge-label-bg:var(--fm-bg);--fm-edge-label-border:var(--fm-cluster-stroke);--fm-edge-label-text:var(--fm-text-color);--fm-surface-shadow:rgba(15,23,42,.08)}svg{shape-rendering:geometricPrecision;background:var(--fm-bg);background-image:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--fm-accent-1) 3%,transparent) 0%,transparent 50%),linear-gradient(180deg,var(--fm-bg) 0%,color-mix(in srgb,var(--fm-bg) 97%,var(--fm-node-stroke) 3%) 100%)}.fm-node{isolation:isolate;--fm-node-accent:var(--fm-node-stroke);--fm-node-hover-accent:var(--fm-edge-color)}.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon{fill:var(--fm-node-fill);stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision;filter: drop-shadow(0 1px 3px rgba(15,23,42,0.08)) drop-shadow(0 1px 2px rgba(15,23,42,0.04));transition:fill 150ms ease,stroke 150ms ease,filter 150ms ease}.fm-node.fm-node-user-mindmap-no-border rect,.fm-node.fm-node-user-mindmap-no-border path,.fm-node.fm-node-user-mindmap-no-border polygon{stroke:none}.fm-node line{stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke}.fm-node text{fill:var(--fm-text-color);font-weight:500;letter-spacing:-.015em;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1,"calt" 1}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke:var(--fm-node-hover-accent);filter: drop-shadow(0 4px 12px rgba(15,23,42,0.12)) drop-shadow(0 2px 4px rgba(15,23,42,0.06));}.fm-node-accent-1{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-1) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-1)}.fm-node-accent-5{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-5) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-5)}.fm-node-accent-6{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-6) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-6)}.fm-edge{fill:none;stroke:var(--fm-edge-color);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;paint-order:stroke;transition:stroke 150ms ease,opacity 150ms ease,stroke-width 150ms ease;cursor:default}.fm-edge:hover{stroke:var(--fm-accent-1);stroke-width:2.25;opacity:1}.fm-edge-solid{stroke-dasharray:none}.fm-edge-back{stroke:var(--fm-edge-muted);opacity:.8;stroke-dasharray:4 4}.fm-label{fill:var(--fm-text-color)}@media (prefers-reduced-motion:reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition:none;transform:none}}.fm-node:focus-visible{outline:2px solid var(--fm-accent-1);outline-offset:3px}/* High contrast mode support */ @media (prefers-contrast: more){svg,:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{.fm-node text,.fm-edge-labeled text,.fm-cluster-label{font-size: 8.0px !important;fill: #111 !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-edge{stroke: #111 !important;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}}</style><defs></defs><text x="440" y="57" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a2e" class="fm-diagram-title">Who ships what</text><g id="fm-node-set-frontend-0" class="fm-node fm-node-accent-1 fm-node-shape-circle fm-node-user-venn-set" data-id="set_Frontend" role="graphics-symbol" aria-label="Frontend" tabindex="0"><circle cx="356.46" cy="260.61" r="131.61" fill="#ffffff" style="fill:#4f6bed; fill-opacity:0.1; stroke:#4f6bed; stroke-width:2.5"/><text x="356.46" y="265.61" text-anchor="middle" font-size="15" fill="#1a1a2e" style="fill:#2b3fae">Frontend</text><title>Node: Frontend, circle</title></g><g id="fm-node-set-backend-1" class="fm-node fm-node-accent-5 fm-node-shape-circle fm-node-user-venn-set" data-id="set_Backend" role="graphics-symbol" aria-label="Backend team" tabindex="0"><circle cx="523.54" cy="260.61" r="131.61" fill="#ffffff" style="fill:#e08a1e; fill-opacity:0.1; stroke:#e08a1e; stroke-width:2.5"/><text x="523.54" y="265.61" text-anchor="middle" font-size="15" fill="#1a1a2e" style="fill:#8a5212">Backend team</text><title>Node: Backend team, circle</title></g><g id="fm-node-set-ops-2" class="fm-node fm-node-accent-1 fm-node-shape-circle fm-node-user-venn-set" data-id="set_Ops" role="graphics-symbol" aria-label="Ops" tabindex="0"><circle cx="488.01" cy="407.28" r="117.72" fill="#ffffff" style="fill:#2f9e72; fill-opacity:0.1; stroke:#2f9e72; stroke-width:2.5"/><text x="488.01" y="412.28" text-anchor="middle" font-size="15" fill="#1a1a2e" style="fill:#1d6449">Ops</text><title>Node: Ops, circle</title></g><g id="fm-node-region-1-3" class="fm-node fm-node-accent-6 fm-node-shape-text-block fm-node-user-venn-region-label" data-id="region_1" role="graphics-symbol" aria-label="APIs" tabindex="0"><g></g><text x="440" y="254.37" text-anchor="middle" font-size="15" fill="#1a1a2e">APIs</text><title>Node: APIs, text block</title></g><g id="fm-node-region-2-4" class="fm-node fm-node-accent-5 fm-node-shape-text-block fm-node-user-venn-region-label" data-id="region_2" role="graphics-symbol" aria-label="Deploys" tabindex="0"><g></g><text x="516.49" y="348.80" text-anchor="middle" font-size="15" fill="#1a1a2e">Deploys</text><title>Node: Deploys, text block</title></g><g id="fm-node-text-3-5" class="fm-node fm-node-accent-1 fm-node-shape-text-block fm-node-user-venn-text" data-id="text_3" role="graphics-symbol" aria-label="CI pipelines" tabindex="0"><g></g><text x="516.49" y="375.80" text-anchor="middle" font-size="15" fill="#1a1a2e">CI pipelines</text><title>Node: CI pipelines, text block</title></g></svg>
