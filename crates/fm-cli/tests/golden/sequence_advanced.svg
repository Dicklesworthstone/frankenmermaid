 var(--fm-accent-1);}.fm-label{fill: var(--fm-text-color);}@media (prefers-reduced-motion: reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition: none;transform: none;}}.fm-node:focus-visible{outline: 2px solid var(--fm-accent-1);outline-offset: 3px;}.fm-edge-labeled > rect{fill: var(--fm-edge-label-bg);stroke: var(--fm-edge-label-border);stroke-width: 0.75;rx: 6px;ry: 6px;}@supports (backdrop-filter: blur(4px)){.fm-edge-labeled > rect{fill: color-mix(in srgb,var(--fm-edge-label-bg) 85%,transparent);backdrop-filter: blur(8px);}}.edge-label{fill: var(--fm-edge-label-text);font-weight: 600;font-size: 0.88em;letter-spacing: -0.01em;text-rendering: optimizeLegibility;}/* High contrast mode support */ @media (prefers-contrast: more){:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{svg{--fm-bg: #fff !important;--fm-node-fill: #fff !important;--fm-node-stroke: #111 !important;--fm-edge-color: #111 !important;--fm-edge-muted: #111 !important;--fm-edge-label-bg: #fff !important;--fm-edge-label-text: #111 !important;--fm-text-color: #111 !important;background: #fff !important;}.fm-node text,.fm-edge-labeled text,.fm-cluster-label,.fm-cluster-type-label,.fm-diagram-title{fill: