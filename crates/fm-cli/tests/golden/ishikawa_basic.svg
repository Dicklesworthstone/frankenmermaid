t:color-mix(in srgb,var(--fm-accent-6) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-6)}.fm-node-accent-7{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-7) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-7)}.fm-node-accent-8{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-8) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-8)}.fm-edge{fill:none;stroke:var(--fm-edge-color);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;paint-order:stroke;transition:stroke 150ms ease,opacity 150ms ease,stroke-width 150ms ease;cursor:default}.fm-edge:hover{stroke:var(--fm-accent-1);stroke-width:2.25;opacity:1}.fm-edge-solid{stroke-dasharray:none}.fm-edge-back{stroke:var(--fm-edge-muted);opacity:.8;stroke-dasharray:4 4}marker#arrow-end path{fill:var(--fm-edge-color);stroke:none;transition:fill 150ms ease}.fm-edge:hover~marker#arrow-end path{fill:var(--fm-accent-1)}.fm-label{fill:var(--fm-text-color)}@media (prefers-reduced-motion:reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition:none;transform:none}}.fm-node:focus-visible{outline:2px solid var(--fm-accent-1);outline-offset:3px}/* High contrast mode support */ @media (prefers-contrast: more){svg,:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 