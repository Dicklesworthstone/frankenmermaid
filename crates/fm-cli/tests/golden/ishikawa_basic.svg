ent-6) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-6)}.fm-node-accent-7{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-7) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-7)}.fm-node-accent-8{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-8) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-8)}.fm-edge{fill:none;stroke:var(--fm-edge-color);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;paint-order:stroke;transition:stroke 150ms ease,opacity 150ms ease,stroke-width 150ms ease;cursor:default}.fm-edge:hover{stroke:var(--fm-accent-1);stroke-width:2.25;opacity:1}.fm-edge-solid{stroke-dasharray:none}.fm-edge-back{stroke:var(--fm-edge-muted);opacity:.8;stroke-dasharray:4 4}marker#arrow-end path{fill:var(--fm-edge-color);stroke:none;transition:fill 150ms ease}.fm-edge:hover~marker#arrow-end path{fill:var(--fm-accent-1)}.fm-label{fill:var(--fm-text-color)}@media (prefers-reduced-motion:reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition:none;transform:none}}.fm-node:focus-visible{outline:2px solid var(--fm-accent-1);outline-offset:3px}/* High contrast mode support */ @media (prefers-contrast: more){svg,:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{svg{--fm-bg: #fff !important;--fm-node-fill: #fff !important;--fm-node-stroke: #111 !important;--fm-edge-color: #111 !important;--fm-edge-muted: #111 !important;--fm-edge-label-bg: #fff !important;--fm-edge-label-text: #111 !important;--fm-text-color: #111 !important;background: #fff !important;}.fm-node text,.fm-edge-labeled text,.fm-cluster-label,.fm-cluster-type-label,.fm-diagram-title{fill: #111;}.fm-edge-labeled > rect,.fm-background{fill: #fff !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-node line,.fm-edge{stroke: #111;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}.fm-node-semantic{--fm-node-fill: #fff !important;--fm-node-stroke: #111 !important;}}</style><defs><marker id="arrow-end" markerWidth="8" markerHeight="7" refX="8" refY="3.50" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.50 L0 7 L2 3.50 Z" fill="#94a3b8"/></marker></defs><g id="fm-edge-0" class="fm-edge" data-fm-edge-id="0" role="graphics-symbol" tabindex="0"><path d="M349.97 94.50 C358.67 156.39,376.07 280.18,384.77 342.07 C384.77 342.07,384.77 342.07,384.77 342.07 C389.77 342.07,399.77 342.07,404.77 342.07" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="0" marker-end="url(#arrow-end)"/><title>People points to Late product launch</title></g><g id="fm-edge-1" class="fm-edge" data-fm-edge-id="1" role="graphics-symbol" tabindex="0"><path d="M331.57 177.02 L361.57 177.02" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="1" marker-end="url(#arrow-end)"/><title>Understaffed QA points to People</title></g><g id="fm-edge-2" class="fm-edge" data-fm-edge-id="2" role="graphics-symbol" tabindex="0"><path d="M343.17 259.54 L373.17 259.54" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="2" marker-end="url(#arrow-end)"/