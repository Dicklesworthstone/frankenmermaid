<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 647.65 756" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" role="graphics-document document" aria-roledescription="flowchart-v2" data-nodes="10" data-edges="9" data-type="flowchart" data-detail-tier="rich"><title>flowchart diagram</title><desc>A flowchart diagram with 10 nodes and 9 edges. Flowing left to right. Key nodes: Start, Arrow, Line. Key relationships: Start points to Arrow; Start connects to Line; Start optionally points to Dotted Arrow. Layout spans 600 by 708 units with 10 rendered node boxes and 9 routed edge paths.</desc><style>:root{--fm-bg: #fafbfc;--fm-text-color: #1a1a2e;--fm-node-fill: #ffffff;--fm-node-stroke: #e2e8f0;--fm-edge-color: #94a3b8;--fm-cluster-fill: rgba(241,245,249,0.6);--fm-cluster-stroke: #cbd5e1;--fm-accent-1: #6366f1;--fm-accent-2: #3b82f6;--fm-accent-3: #06b6d4;--fm-accent-4: #8b5cf6;--fm-accent-5: #f59e0b;--fm-accent-6: #ec4899;--fm-accent-7: #10b981;--fm-accent-8: #f43f5e;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}:root{--fm-edge-muted: var(--fm-cluster-stroke);--fm-edge-label-bg: var(--fm-bg);--fm-edge-label-border: var(--fm-cluster-stroke);--fm-edge-label-text: var(--fm-text-color);--fm-surface-shadow: rgba(15,23,42,0.1);}svg{shape-rendering: geometricPrecision;background: var(--fm-bg);background-image:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--fm-accent-1) 4%,transparent) 0%,transparent 50%),linear-gradient(180deg,var(--fm-bg) 0%,color-mix(in srgb,var(--fm-bg) 96%,var(--fm-node-stroke) 4%) 100%);}.fm-node{isolation: isolate;--fm-node-accent: var(--fm-node-stroke);--fm-node-hover-accent: var(--fm-edge-color);}.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon{fill: var(--fm-node-fill);stroke: var(--fm-node-accent);stroke-width: 1.6;vector-effect: non-scaling-stroke;shape-rendering: geometricPrecision;filter: drop-shadow(0 2px 8px rgba(0,0,0,0.10)) drop-shadow(0 1px 3px rgba(0,0,0,0.06));transition: fill 200ms ease,stroke 200ms ease,filter 200ms ease;}.fm-node.fm-node-user-mindmap-no-border rect,.fm-node.fm-node-user-mindmap-no-border path,.fm-node.fm-node-user-mindmap-no-border polygon{stroke: none;}.fm-node line{stroke: var(--fm-node-accent);stroke-width: 1.5;vector-effect: non-scaling-stroke;}.fm-node text{fill: var(--fm-text-color);font-weight: 600;letter-spacing: -0.02em;text-rendering: optimizeLegibility;font-feature-settings: "kern" 1,"liga" 1,"calt" 1;}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke: var(--fm-node-hover-accent);filter: drop-shadow(0 8px 20px rgba(0,0,0,0.14)) drop-shadow(0 3px 8px rgba(0,0,0,0.08));}.fm-node-accent-1{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-1) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-1);}.fm-node-accent-2{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-2) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-2);}.fm-node-accent-3{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-3) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-3);}.fm-node-accent-4{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-4) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-4);}.fm-node-accent-5{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-5) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-5);}.fm-node-accent-6{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-6) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-6);}.fm-node-accent-7{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-7) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-7);}.fm-node-accent-8{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-8) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-8);}.fm-edge{fill: none;stroke: var(--fm-edge-color);stroke-linecap: round;stroke-linejoin: round;vector-effect: non-scaling-stroke;paint-order: stroke;transition: stroke 200ms ease,opacity 200ms ease,stroke-width 200ms ease;cursor: default;}.fm-edge:hover{stroke: var(--fm-accent-1);stroke-width: 2.5;opacity: 1;}.fm-edge-solid{stroke-dasharray: none;}.fm-edge-dashed{stroke-dasharray: 6 6;}.fm-edge-thick{stroke-width: 2.5;}.fm-edge-thick:hover{stroke-width: 3.5;}.fm-edge-back{stroke: var(--fm-edge-muted);opacity: 0.8;stroke-dasharray: 4 4;}marker#arrow-end path,marker#arrow-filled path,marker#arrow-circle path{fill: var(--fm-edge-color);stroke: none;transition: fill 200ms ease;}.fm-edge:hover ~ marker#arrow-end path,.fm-edge:hover ~ marker#arrow-filled path,.fm-edge:hover ~ marker#arrow-circle path{fill: var(--fm-accent-1);}marker#arrow-cross path{stroke: var(--fm-edge-color);fill: none;stroke-width: 1.8;transition: stroke 200ms ease;}.fm-label{fill: var(--fm-text-color);}@media (prefers-reduced-motion: reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition: none;transform: none;}}.fm-node:focus-visible{outline: 2px solid var(--fm-accent-1);outline-offset: 3px;}/* High contrast mode support */ @media (prefers-contrast: more){:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{svg{--fm-bg: #fff !important;--fm-node-fill: #fff !important;--fm-node-stroke: #111 !important;--fm-edge-color: #111 !important;--fm-edge-muted: #111 !important;--fm-edge-label-bg: #fff !important;--fm-edge-label-text: #111 !important;--fm-text-color: #111 !important;background: #fff !important;}.fm-node text,.fm-edge-labeled text,.fm-cluster-label,.fm-cluster-type-label,.fm-diagram-title{fill: #111;}.fm-edge-labeled > rect,.fm-background{fill: #fff !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-node line,.fm-edge{stroke: #111;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}.fm-node-semantic{--fm-node-fill: #fff !important;--fm-node-stroke: #111 !important;}}</style><defs><marker id="arrow-end" markerWidth="8" markerHeight="7" refX="8" refY="3.50" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.50 L0 7 L2 3.50 Z" fill="#94a3b8"/></marker><marker id="arrow-filled" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4 L0 8 L2.50 4 Z" fill="#94a3b8"/></marker><marker id="arrow-start" markerWidth="8" markerHeight="7" refX="8" refY="3.50" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L8 3.50 L0 7 L2 3.50 Z" fill="#94a3b8"/></marker><marker id="arrow-circle" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M6 3 A3 3 0 0 1 0 3 A3 3 0 0 1 6 3 Z" fill="#94a3b8"/></marker><marker id="arrow-cross" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 6 M6 0 L0 6" fill="none" stroke="#94a3b8" stroke-width="1.20"/></marker></defs><g id="fm-edge-0" class="fm-edge" data-fm-edge-id="0" role="graphics-symbol" tabindex="0"><path d="M155.35 378 L181.35 378 Q187.35 378,187.35 372 L187.35 81.25 Q187.35 75.25,193.35 75.25 L219.35 75.25" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="0" marker-end="url(#arrow-end)"/><title>Start points to Arrow</title></g><g id="fm-edge-1" class="fm-edge" data-fm-edge-id="1" role="graphics-symbol" tabindex="0"><path d="M155.35 378 L181.35 378 Q187.35 378,187.35 372 L187.35 167.75 Q187.35 161.75,193.35 161.75 L219.35 161.75" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="1"/><title>Start connects to Line</title></g><g id="fm-edge-2" class="fm-edge" data-fm-edge-id="2" role="graphics-symbol" tabindex="0"><path d="M155.35 378 L181.35 378 Q187.35 378,187.35 372 L187.35 254.25 Q187.35 248.25,193.35 248.25 L219.35 248.25" stroke-width="1.80" class="fm-edge fm-edge-dashed" data-fm-edge-id="2" marker-end="url(#arrow-end)" stroke-dasharray="5,5"/><title>Start optionally points to Dotted Arrow</title></g><g id="fm-edge-3" class="fm-edge" data-fm-edge-id="3" role="graphics-symbol" tabindex="0"><path d="M155.35 378 L181.35 378 Q187.35 378,187.35 372 L187.35 340.75 Q187.35 334.75,193.35 334.75 L219.35 334.75" stroke-width="1.80" class="fm-edge fm-edge-dashed" data-fm-edge-id="3" stroke-dasharray="5,5"/><title>Start optionally connects to Dotted Line</title></g><g id="fm-edge-4" class="fm-edge" data-fm-edge-id="4" role="graphics-symbol" tabindex="0"><path d="M155.35 378 L181.35 378 Q187.35 378,187.35 384 L187.35 415.25 Q187.35 421.25,193.35 421.25 L219.35 421.25" stroke-width="2.50" class="fm-edge fm-edge-thick" data-fm-edge-id="4" marker-end="url(#arrow-filled)"/><title>Start strongly points to Thick Arrow</title></g><g id="fm-edge-5" class="fm-edge" data-fm-edge-id="5" role="graphics-symbol" tabindex="0"><path d="M155.35 378 L181.35 378 Q187.35 378,187.35 384 L187.35 501.75 Q187.35 507.75,193.35 507.75 L219.35 507.75" stroke-width="2.50" class="fm-edge fm-edge-thick" data-fm-edge-id="5"/><title>Start strongly connects to Thick Line</title></g><g id="fm-edge-6" class="fm-edge" data-fm-edge-id="6" role="graphics-symbol" tabindex="0"><path d="M155.35 378 L181.35 378 Q187.35 378,187.35 384 L187.35 588.25 Q187.35 594.25,193.35 594.25 L219.35 594.25" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="6" marker-end="url(#arrow-circle)"/><title>Start relates to Circle End</title></g><g id="fm-edge-7" class="fm-edge" data-fm-edge-id="7" role="graphics-symbol" tabindex="0"><path d="M155.35 378 L181.35 378 Q187.35 378,187.35 384 L187.35 674.75 Q187.35 680.75,193.35 680.75 L219.35 680.75" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="7" marker-end="url(#arrow-cross)"/><title>Start blocks Cross End</title></g><g id="fm-edge-8" class="fm-edge" data-fm-edge-id="8" role="graphics-symbol" tabindex="0"><path d="M327.65 75.25 L438.68 75.25" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="8" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/><title>Arrow points both ways to Double Arrow</title></g><g id="fm-node-a-0" class="fm-node fm-node-accent-5 fm-node-shape-rect" data-id="A" role="graphics-symbol" aria-label="Start" tabindex="0"><rect x="52" y="354.75" width="103.35" height="46.50" fill="#ffffff" rx="5.50"/><text x="103.68" y="383" text-anchor="middle" font-size="15" fill="#1a1a2e" xml:space="preserve">Start</text><title>Node: Start, rectangle</title></g><g id="fm-node-b-1" class="fm-node fm-node-accent-6 fm-node-shape-rect" data-id="B" role="graphics-symbol" aria-label="Arrow" tabindex="0"><rect x="219.35" y="52" width="108.30" height="46.50" fill="#ffffff" rx="5.50"/><text x="273.50" y="80.25" text-anchor="middle" font-size="15" fill="#1a1a2e" xml:space="preserve">Arrow</text><title>Node: Arrow, rectangle</title></g><g id="fm-node-c-2" class="fm-node fm-node-accent-3 fm-node-shape-rect" data-id="C" role="graphics-symbol" aria-label="Line" tabindex="0"><rect x="219.35" y="138.50" width="100.05" height="46.50" fill="#ffffff" rx="5.50"/><text x="269.38" y="166.75" text-anchor="middle" font-size="15" fill="#1a1a2e" xml:space="preserve">Line</text><title>Node: Line, rectangle</title></g><g id="fm-node-d-3" class="fm-node fm-node-accent-4 fm-node-shape-rect" data-id="D" role="graphics-symbol" aria-label="Dotted Arrow" tabindex="0"><rect x="219.35" y="225" width="155.33" height="46.50" fill="#ffffff" rx="5.50"/><text x="297.01" y="253.25" text-anchor="middle" font-size="15" fill="#1a1a2e" xml:space="preserve">Dotted Arrow</text><title>Node: Dotted Arrow, rectangle</title></g><g id="fm-node-e-4" class="fm-node fm-node-accent-1 fm-node-shape-rect" data-id="E" role="graphics-symbol" aria-label="Dotted Line" tabindex="0"><rect x="219.35" y="311.50" width="147.07" height="46.50" fill="#ffffff" rx="5.50"/><text x="292.89" y="339.75" text-anchor="middle" font-size="15" fill="#1a1a2e" xml:space="preserve">Dotted Line</text><title>Node: Dotted Line, rectangle</title></g><g id="fm-node-f-5" class="fm-node fm-node-accent-2 fm-node-shape-rect" data-id="F" role="graphics-symbol" aria-label="Thick Arrow" tabindex="0"><rect x="219.35" y="398" width="148.73" height="46.50" fill="#ffffff" rx="5.50"/><text x="293.71" y="426.25" text-anchor="middle" font-size="15" fill="#1a1a2e" xml:space="preserve">Thick Arrow</text><title>Node: Thick Arrow, rectangle</title></g><g id="fm-node-g-6" class="fm-node fm-node-accent-7 fm-node-shape-rect" data-id="G" role="graphics-symbol" aria-label="Thick Line" tabindex="0"><rect x="219.35" y="484.50" width="140.48" height="46.50" fill="#ffffff" rx="5.50"/><text x="289.59" y="512.75" text-anchor="middle" font-size="15" fill="#1a1a2e" xml:space="preserve">Thick Line</text><title>Node: Thick Line, rectangle</title></g><g id="fm-node-h-7" class="fm-node fm-node-accent-8 fm-node-shape-rect" data-id="H" role="graphics-symbol" aria-label="Circle End" tabindex="0"><rect x="219.35" y="571" width="137.18" height="46.50" fill="#ffffff" rx="5.50"/><text x="287.94" y="599.25" text-anchor="middle" font-size="15" fill="#1a1a2e" xml:space="preserve">Circle End</text><title>Node: Circle End, rectangle</title></g><g id="fm-node-i-8" class="fm-node fm-node-accent-5 fm-node-shape-rect" data-id="I" role="graphics-symbol" aria-label="Cross End" tabindex="0"><rect x="219.35" y="657.50" width="138.82" height="46.50" fill="#ffffff" rx="5.50"/><text x="288.76" y="685.75" text-anchor="middle" font-size="15" fill="#1a1a2e" xml:space="preserve">Cross End</text><title>Node: Cross End, rectangle</title></g><g id="fm-node-j-9" class="fm-node fm-node-accent-6 fm-node-shape-rect" data-id="J" role="graphics-symbol" aria-label="Double Arrow" tabindex="0"><rect x="438.68" y="52" width="156.98" height="46.50" fill="#ffffff" rx="5.50"/><text x="517.16" y="80.25" text-anchor="middle" font-size="15" fill="#1a1a2e" xml:space="preserve">Double Arrow</text><title>Node: Double Arrow, rectangle</title></g></svg>
