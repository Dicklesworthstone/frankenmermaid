(--fm-accent-6);}.fm-node-accent-7{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-7) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-7);}.fm-node-accent-8{--fm-node-accent: var(--fm-node-stroke);--fm-node-accent: color-mix(in srgb,var(--fm-accent-8) 50%,var(--fm-node-stroke));--fm-node-hover-accent: var(--fm-accent-8);}.fm-edge{fill: none;stroke: var(--fm-edge-color);stroke-linecap: round;stroke-linejoin: round;vector-effect: non-scaling-stroke;paint-order: stroke;transition: stroke 200ms ease,opacity 200ms ease,stroke-width 200ms ease;cursor: default;}.fm-edge:hover{stroke: var(--fm-accent-1);stroke-width: 2.5;opacity: 1;}.fm-edge-solid{stroke-dasharray: none;}.fm-edge-back{stroke: var(--fm-edge-muted);opacity: 0.8;stroke-dasharray: 4 4;}.fm-cluster{fill: var(--fm-cluster-fill);stroke: var(--fm-cluster-stroke);stroke-width: 1;stroke-dasharray: 5 3;rx: 12;ry: 12;}.fm-cluster-label{fill: var(--fm-cluster-label-color);font-weight: 700;font-size: 0.85em;letter-spacing: 0.01em;}.fm-cluster-c4{fill: var(--fm-cluster-c4-fill);stroke: var(--fm-cluster-c4-stroke);stroke-dasharray: none;}.fm-cluster-swimlane{fill: var(--fm-cluster-swimlane-fill);stroke: var(--fm-cluster-swimlane-stroke);stroke-dasharray: none;}.fm-label{fill: var(--fm-text-color);}@media (prefers-reduced-motion: reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition: none;transform: none;}}.fm-node:focus-visible{outline: 2px solid var(--fm-accent-1);outline-offset: 3px;}/* High contrast mode support */ @media (prefers-contrast: more){:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{svg{--fm-bg: #fff !important;--fm-node-fill: #fff !important;--fm-node-stroke: #111 !important;--fm-edge-color: #111 !important;--fm-edge-muted: #111 !important;--fm-edge-label-bg: #fff !important;--fm-edge-label-text: #111 !important;--fm-text-color: #111 !important;background: #fff !important;}.fm-node text,.fm-edge-labeled text,.fm-cluster-label,.fm-cluster-type-label,.fm-diagram-title{fill: #111;}.fm-edge-labeled > rect,.fm-background{fill: #fff !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-node line,.fm-edge{stroke: #111;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}.fm-node-semantic{--fm-node-fill: #fff !important;--fm-node-stroke: #111 !important;}}</style><defs></defs><rect id="fm-cluster-0" x="52" y="52" width="200" height="295.55" fill="rgba(241,245,249,0.6)" stroke="#cbd5e1" stroke-width="1" rx="15" class="fm-cluster fm-cluster-swimlane"/><text x="60" y="68" text-anchor="start" font-size="13.50" font-weight="600" fill="var(--fm-cluster-label-color)" class="fm-cluster-label">Todo</text><rect id="fm-cluster-1" x="316" y="52" width="200" height="295.55" fill="rgba(241,245,249,0.6)" stroke="#cbd5e1" stroke-width="1" rx="15" class="fm-cluster fm-cluster-swimlane"/><text x="324" y="68" text-anchor="start" font-size="13.50" font-weight="600" fill="var(--fm-cluster-label-color)" class="fm-cluster-label">In Progress</text><rect id="fm-cluster-2" x="580" y="52" width="200" height="295.55" fill="rgba(241,245,249,0.6)" stroke="#cbd5e1" stroke-width="1" rx="15" class="fm