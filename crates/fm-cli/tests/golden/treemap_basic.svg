node-user-mindmap-no-border rect,.fm-node.fm-node-user-mindmap-no-border path,.fm-node.fm-node-user-mindmap-no-border polygon{stroke:none}.fm-node line{stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke}.fm-node text{fill:var(--fm-text-color);font-weight:500;letter-spacing:-.015em;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1,"calt" 1}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke:var(--fm-node-hover-accent);filter: drop-shadow(0 4px 12px rgba(15,23,42,0.12)) drop-shadow(0 2px 4px rgba(15,23,42,0.06));}.fm-edge{fill:none;stroke:var(--fm-edge-color);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;paint-order:stroke;transition:stroke 150ms ease,opacity 150ms ease,stroke-width 150ms ease;cursor:default}.fm-edge:hover{stroke:var(--fm-accent-1);stroke-width:2.25;opacity:1}.fm-edge-solid{stroke-dasharray:none}.fm-edge-back{stroke:var(--fm-edge-muted);opacity:.8;stroke-dasharray:4 4}.fm-label{fill:var(--fm-text-color)}@media (prefers-reduced-motion:reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition:none;transform:none}}.fm-node:focus-visible{outline:2px solid var(--fm-accent-1);outline-offset:3px}/* High contrast mode support */ @media (prefers-contrast: more){svg,:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc