<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<!-- Generated by frankenmermaid's deck exporter (epic bd-z7g6k). Self-contained: the rendered SVG,
     the deck manifest, and the presentation runtime are all inline. Deliberately neutral
     chrome — this file is the USER'S talk, not a frankenmermaid advertisement. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: system-ui, sans-serif;
    background: {{BG}}; color: {{FG}}; }
  #deck-stage { position: relative; overflow: hidden; width: 100vw; height: 100vh;
    touch-action: none; cursor: grab; outline: none; background: inherit; }
  #deck-card { position: fixed; left: 22px; bottom: 20px; z-index: 10;
    max-width: min(580px, 68vw); pointer-events: none; }
  #deck-num { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
    opacity: .55; margin-bottom: 4px; }
  #deck-title { font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  #deck-caption { font-size: 12.5px; font-style: italic; margin-top: 4px; line-height: 1.45;
    opacity: .7; }
  #deck-controls { position: fixed; right: 22px; bottom: 20px; z-index: 10; display: flex;
    gap: 8px; align-items: center; }
  #deck-controls button { border: 1.5px solid currentColor; opacity: .8; background: transparent;
    color: inherit; border-radius: 999px; min-width: 42px; height: 42px; font-size: 15px;
    cursor: pointer; padding: 0 14px; font-family: inherit; }
  #deck-controls button:hover { opacity: 1; }
  #deck-dots { position: fixed; bottom: 74px; right: 26px; display: flex; gap: 5px; z-index: 10; }
  #deck-dots i { width: 6px; height: 6px; border-radius: 999px; background: currentColor;
    opacity: .2; cursor: pointer; }
  #deck-dots i[data-active] { opacity: 1; }
  #deck-hints { position: fixed; top: 16px; right: 22px; z-index: 10; text-align: right;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; opacity: .5;
    line-height: 1.6; pointer-events: none; }
  @media (max-width: 700px) {
    #deck-hints, #deck-dots { display: none; }
    #deck-card { left: 16px; right: 16px; top: 16px; bottom: auto; max-width: none; }
  }
  #deck-print-pages { display: none; }
  @page { size: 10in 5.625in; margin: 0; }
  @media print {
    html, body { height: auto; overflow: visible; print-color-adjust: exact;
      -webkit-print-color-adjust: exact; }
    #deck-stage { display: none; }
    #deck-print-pages { display: block; }
    .deck-print-page { width: 10in; height: 5.625in; padding: .22in .32in;
      display: flex; flex-direction: column; gap: .05in; overflow: hidden;
      break-inside: avoid; break-after: page; }
    .deck-print-page:last-child { break-after: auto; }
    .deck-print-graph { flex: 1; min-height: 0; overflow: hidden; }
    .deck-print-page h2 { font-size: 16pt; line-height: 1.15; }
    .deck-print-page p { font-size: 10pt; line-height: 1.25; }
  }
</style>
</head>
<body>
<div id="deck-stage" tabindex="0">
<!-- Fullscreen promotes the stage and its descendants only. Keep the narration and
     controls inside it so presenting never hides the slide title or navigation. -->
<div id="deck-chrome">
<div id="deck-card">
  <div id="deck-num"></div>
  <div id="deck-title"></div>
  <div id="deck-caption"></div>
</div>
<div id="deck-dots"></div>
<div id="deck-controls">
  <button id="deck-print" type="button">Print deck</button>
  <button id="deck-overview-btn" type="button">whole graph</button>
  <button id="deck-prev" type="button" aria-label="previous">‹</button>
  <button id="deck-next" type="button" aria-label="next">›</button>
</div>
<div id="deck-hints">←/→ steps &amp; slides · o whole graph · f fullscreen<br>
esc guided camera · drag pan · scroll zoom · click a dimmed node to travel</div>
</div>
</div>

<div id="deck-print-pages"></div>
<script type="application/json" id="deck-manifest">{{MANIFEST_JSON}}</script>
<script>RUNTIME_JS</script>
<script>
"use strict";
(() => {
  var stage = document.getElementById("deck-stage");
  var chrome = document.getElementById("deck-chrome");
  var manifest = JSON.parse(document.getElementById("deck-manifest").textContent);
  // The runtime owns camera gestures on the stage. Native controls must keep their
  // pointer targets rather than being captured as a diagram drag, including on touch.
  ["pointerdown", "wheel", "dblclick"].forEach(function (type) {
    chrome.addEventListener(type, function (event) { event.stopPropagation(); });
  });
  chrome.addEventListener("keydown", function (event) {
    if (event.key !== " " && event.key !== "Enter") return;
    var control = event.target.closest("button, [role='button']");
    if (!control || !chrome.contains(control)) return;
    // Space activates the focused control, not the stage's Next shortcut. The dots
    // are role-buttons, so supply their activation; real buttons keep native behavior.
    event.stopPropagation();
    if (control.tagName !== "BUTTON") {
      event.preventDefault();
      control.click();
    }
  });
  // mount announces its initial slide synchronously and rewrites the hash below. Capture
  // the requested deep link first; malformed percent escapes should not break a talk.
  var requested = "";
  try { requested = decodeURIComponent((location.hash || "").replace(/^#/, "")); }
  catch (_error) { /* Ignore a malformed fragment and present the first slide. */ }
  var svgSource = {{SVG_JS_STRING}};
  var deck = window.FmDeckRuntime.mount({
    stage: stage,
    svg: svgSource,
    manifest: manifest,
    ui: {
      num: document.getElementById("deck-num"),
      title: document.getElementById("deck-title"),
      caption: document.getElementById("deck-caption"),
      dots: document.getElementById("deck-dots"),
      prevBtn: document.getElementById("deck-prev"),
      nextBtn: document.getElementById("deck-next"),
      overviewBtn: document.getElementById("deck-overview-btn")
    },
    // Hash deep links: emailed decks land on the slide the sender was looking at. The
    // runtime owns every presentation KEY (arrows/o/f/Escape/Home/End on the stage);
    // this wiring is deliberately limited to URL state + initial focus.
    onSlideChange: function (index, slide) {
      try {
        var id = slide ? slide.id : "overview";
        if (history.replaceState) history.replaceState(null, "", "#" + encodeURIComponent(id));
      } catch (_error) { /* file:// may refuse; non-fatal */ }
    }
  });
  if (requested) {
    if (requested === "overview") deck.overview();
    else {
      for (var i = 0; i < manifest.slides.length; i += 1) {
        if (manifest.slides[i].id === requested) { deck.go(i); break; }
      }
    }
  }
  // Print from the original SVG. The live viewport may be panned, mid-animation,
  // or showing an early step. Each paper page represents one fully revealed slide.
  var pages = document.getElementById("deck-print-pages");
  function preparePrint() {
    if (pages.childElementCount) return;
    var template = document.createElement("template");
    template.innerHTML = svgSource; // Engine SVG, the same input supplied to mount.
    var original = template.content.querySelector("svg");
    if (!original) return;

    var members = new Set();
    function visitMembers(slide, visit) {
      slide.nodes.forEach(function (member) { visit(member.elementId, 1); });
      (slide.edges || []).forEach(function (edge) {
        visit(edge.elementId, edge.touching ? .45 : 1);
      });
      (slide.clusters || []).forEach(function (cluster) {
        visit(cluster.elementId, cluster.cameraContained ? 1 : .45);
      });
    }
    manifest.slides.forEach(function (slide) {
      visitMembers(slide, function (id) { members.add(id); });
    });
    [manifest.nodeGeometry, manifest.edgeEndpoints].forEach(function (record) {
      Object.keys(record || {}).forEach(function (id) { members.add(id); });
    });

    var fragment = document.createDocumentFragment();
    manifest.slides.forEach(function (slide) {
      var page = document.createElement("section");
      page.className = "deck-print-page";
      var graph = document.createElement("div");
      graph.className = "deck-print-graph";
      page.appendChild(graph);
      // Isolate each SVG's IDs. Its local gradients, clip paths and arrowhead
      // markers must resolve inside this page even when all pages are printed together.
      var svg = original.cloneNode(true);
      graph.attachShadow({ mode: "open" }).appendChild(svg);
      var bounds = slide.bounds || manifest.viewBox;
      var margin = Math.max(0, slide.fitMargin || 0);
      svg.setAttribute("viewBox", [
        bounds.x - margin, bounds.y - margin,
        Math.max(1, bounds.width + 2 * margin), Math.max(1, bounds.height + 2 * margin),
      ].join(" "));
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
      svg.style.cssText += ";width:100%;height:100%;max-width:none;max-height:none;display:block";
      var focus = new Map();
      visitMembers(slide, function (id, opacity) { focus.set(id, opacity); });
      svg.querySelectorAll("[id]").forEach(function (el) {
        var id = el.id;
        // Mirrored sequence participant headers follow their primary element.
        if (!members.has(id) && id.startsWith("fm-node-")) {
          while (!members.has(id) && id.lastIndexOf("-") > 0) {
            id = id.slice(0, id.lastIndexOf("-"));
          }
        }
        if (!members.has(id)) return;
        var opacity = focus.has(id) ? focus.get(id) : manifest.options.dimOpacity;
        if (opacity < 1) el.style.setProperty("opacity", String(opacity), "important");
      });
      var title = document.createElement("h2");
      title.textContent = slide.title;
      page.appendChild(title);
      if (slide.caption) {
        var caption = document.createElement("p");
        caption.textContent = slide.caption;
        page.appendChild(caption);
      }
      fragment.appendChild(page);
    });
    pages.appendChild(fragment);
  }
  window.addEventListener("beforeprint", preparePrint);
  window.addEventListener("afterprint", function () { pages.replaceChildren(); });
  document.getElementById("deck-print").addEventListener("click", function () {
    window.print();
  });
  // Embedded live previews must not steal the source editor's keyboard focus on refresh.
  if (window.parent === window) stage.focus();
})();
</script>
</body>
</html>
