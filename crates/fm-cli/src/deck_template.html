<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<!-- Generated by `frankenmermaid deck` (epic bd-z7g6k). Self-contained: the rendered SVG,
     the deck manifest, and the presentation runtime are all inline. Deliberately neutral
     chrome — this file is the USER'S talk, not a frankenmermaid advertisement. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: system-ui, sans-serif;
    background: {{BG}}; color: {{FG}}; }
  #deck-stage { position: relative; overflow: hidden; width: 100vw; height: 100vh;
    touch-action: none; cursor: grab; outline: none; }
  #deck-card { position: fixed; left: 22px; bottom: 20px; z-index: 10;
    max-width: min(580px, 68vw); pointer-events: none; }
  #deck-num { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
    opacity: .55; margin-bottom: 4px; }
  #deck-title { font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  #deck-caption { font-size: 12.5px; font-style: italic; margin-top: 4px; line-height: 1.45;
    opacity: .7; }
  #deck-controls { position: fixed; right: 22px; bottom: 20px; z-index: 10; display: flex;
    gap: 8px; align-items: center; }
  #deck-controls button { border: 1.5px solid currentColor; opacity: .8; background: transparent;
    color: inherit; border-radius: 999px; min-width: 42px; height: 42px; font-size: 15px;
    cursor: pointer; padding: 0 14px; font-family: inherit; }
  #deck-controls button:hover { opacity: 1; }
  #deck-dots { position: fixed; bottom: 74px; right: 26px; display: flex; gap: 5px; z-index: 10; }
  #deck-dots i { width: 6px; height: 6px; border-radius: 999px; background: currentColor;
    opacity: .2; cursor: pointer; }
  #deck-dots i[data-active] { opacity: 1; }
  #deck-hints { position: fixed; top: 16px; right: 22px; z-index: 10; text-align: right;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; opacity: .5;
    line-height: 1.6; pointer-events: none; }
  @media (max-width: 700px) { #deck-hints, #deck-dots { display: none; } }
</style>
</head>
<body>
<div id="deck-stage" tabindex="0"></div>
<div id="deck-card">
  <div id="deck-num"></div>
  <div id="deck-title"></div>
  <div id="deck-caption"></div>
</div>
<div id="deck-dots"></div>
<div id="deck-controls">
  <button id="deck-overview-btn" type="button">whole graph</button>
  <button id="deck-prev" type="button" aria-label="previous">‹</button>
  <button id="deck-next" type="button" aria-label="next">›</button>
</div>
<div id="deck-hints">←/→ steps &amp; slides · o whole graph · f fullscreen<br>
esc guided camera · drag pan · scroll zoom · click a dimmed node to travel</div>

<script type="application/json" id="deck-manifest">{{MANIFEST_JSON}}</script>
<script>{{RUNTIME_JS}}</script>
<script>
"use strict";
(function () {
  var stage = document.getElementById("deck-stage");
  var manifest = JSON.parse(document.getElementById("deck-manifest").textContent);
  var deck = window.FmDeckRuntime.mount({
    stage: stage,
    svg: {{SVG_JS_STRING}},
    manifest: manifest,
    ui: {
      num: document.getElementById("deck-num"),
      title: document.getElementById("deck-title"),
      caption: document.getElementById("deck-caption"),
      dots: document.getElementById("deck-dots"),
      prevBtn: document.getElementById("deck-prev"),
      nextBtn: document.getElementById("deck-next"),
      overviewBtn: document.getElementById("deck-overview-btn")
    },
    // Hash deep links: emailed decks land on the slide the sender was looking at. The
    // runtime owns every presentation KEY (arrows/o/f/Escape/Home/End on the stage);
    // this wiring is deliberately limited to URL state + initial focus.
    onSlideChange: function (index, slide) {
      try {
        var id = slide ? slide.id : "overview";
        if (history.replaceState) history.replaceState(null, "", "#" + encodeURIComponent(id));
      } catch (_error) { /* file:// may refuse; non-fatal */ }
    }
  });
  var requested = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if (requested) {
    if (requested === "overview") deck.overview();
    else {
      for (var i = 0; i < manifest.slides.length; i += 1) {
        if (manifest.slides[i].id === requested) { deck.go(i); break; }
      }
    }
  }
  stage.focus();
})();
</script>
</body>
</html>
