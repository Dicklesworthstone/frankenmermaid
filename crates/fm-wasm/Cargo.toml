[package]
name = "fm-wasm"
description = "Rust-first Mermaid-compatible diagram engine for WebAssembly and browser rendering"
keywords = ["mermaid", "diagram", "wasm", "svg", "canvas"]
categories = ["wasm", "visualization", "web-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
fnx-integration = ["fm-layout/fnx-integration"]
fnx-experimental-directed = ["fm-layout/fnx-experimental-directed"]

[dependencies]
fm-core.workspace = true
fm-layout.workspace = true
fm-parser.workspace = true
fm-render-canvas.workspace = true
fm-render-svg.workspace = true
js-sys.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
# Needed on wasm32 too, not just natively: the worker protocol is deliberately JSON TEXT so a
# request can cross `postMessage` without a browser-only `JsValue`, and the worker entry point has
# to parse that text inside the wasm module. Already in the lock via fm-core/fm-layout.
serde_json.workspace = true
wasm-bindgen.workspace = true
web-sys.workspace = true
# Portable monotonic clock; `std::time::Instant` traps on wasm32-unknown-unknown (GH#3).
web-time.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
