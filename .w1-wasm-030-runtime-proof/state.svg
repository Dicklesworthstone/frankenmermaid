<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431.5 437" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" role="graphics-document document" aria-roledescription="stateDiagram" data-nodes="3" data-edges="3" data-type="state" data-detail-tier="normal"><title>state diagram</title><desc>A state diagram with 3 nodes and 3 edges. Flowing top to bottom. Key nodes: __state_start, Idle, Busy. Key relationships: __state_start points to Idle; Idle points to Busy with label: start; Busy points to Idle with label: done. Layout spans 352 by 357 units with 3 rendered node boxes and 3 routed edge paths.</desc><style>svg{--fm-bg: #fafbfc;--fm-text-color: #1e293b;--fm-node-fill: #ffffff;--fm-node-stroke: #cbd5e1;--fm-edge-color: #64748b;--fm-cluster-fill: rgba(241,245,249,0.65);--fm-cluster-stroke: #94a3b8;--fm-accent-1: #4f46e5;--fm-accent-4: #7c3aed;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}svg{--fm-edge-muted:var(--fm-cluster-stroke);--fm-edge-label-bg:var(--fm-bg);--fm-edge-label-border:var(--fm-cluster-stroke);--fm-edge-label-text:var(--fm-text-color);--fm-surface-shadow:rgba(15,23,42,.08)}svg{shape-rendering:geometricPrecision;background:var(--fm-bg)}.fm-node{isolation:isolate;--fm-node-accent:var(--fm-node-stroke);--fm-node-hover-accent:var(--fm-edge-color)}.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon{fill:var(--fm-node-fill);stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision;transition:fill 150ms ease,stroke 150ms ease,filter 150ms ease}.fm-node.fm-node-user-mindmap-no-border rect,.fm-node.fm-node-user-mindmap-no-border path,.fm-node.fm-node-user-mindmap-no-border polygon{stroke:none}.fm-node line{stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke}.fm-node text{fill:var(--fm-text-color);font-weight:500;letter-spacing:-.015em;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1,"calt" 1}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke:var(--fm-node-hover-accent);}.fm-node-accent-1{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-1) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-1)}.fm-node-accent-4{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-4) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-4)}.fm-edge{fill:none;stroke:var(--fm-edge-color);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;paint-order:stroke;transition:stroke 150ms ease,opacity 150ms ease,stroke-width 150ms ease;cursor:default}.fm-edge:hover{stroke:var(--fm-accent-1);stroke-width:2.25;opacity:1}.fm-edge-solid{stroke-dasharray:none}.fm-edge-back{stroke:var(--fm-edge-muted);opacity:.8;stroke-dasharray:4 4}marker#arrow-end path{fill:var(--fm-edge-color);stroke:none;transition:fill 150ms ease}.fm-edge:hover~marker#arrow-end path{fill:var(--fm-accent-1)}marker#arrow-open path{stroke:var(--fm-edge-muted);fill:none;stroke-width:1.5;transition:stroke 150ms ease}.fm-label{fill:var(--fm-text-color)}@media (prefers-reduced-motion:reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition:none;transform:none}}.fm-node:focus-visible{outline:2px solid var(--fm-accent-1);outline-offset:3px}.fm-edge-labeled > rect{fill: var(--fm-edge-label-bg);stroke: var(--fm-edge-label-border);stroke-width: 0.85;rx: 6px;ry: 6px;}@supports (backdrop-filter: blur(4px)){.fm-edge-labeled > rect{fill: color-mix(in srgb,var(--fm-edge-label-bg) 90%,transparent);backdrop-filter: blur(8px);}}.edge-label{fill: var(--fm-edge-label-text);font-weight: 500;font-size: 0.85em;letter-spacing: -0.01em;text-rendering: optimizeLegibility;}.fm-cluster{fill-opacity: 0.06;}/* High contrast mode support */ @media (prefers-contrast: more){svg,:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{.fm-node text,.fm-edge-labeled text,.fm-cluster-label{font-size: 8.0px !important;fill: #111 !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-edge{stroke: #111 !important;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}#fm-node-gradient stop{stop-color: #fff !important;stop-opacity: 1 !important;}}</style><defs><marker id="arrow-end" markerWidth="8" markerHeight="7" refX="8" refY="3.50" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.50 L0 7 L2 3.50 Z" fill="#64748b"/></marker><marker id="arrow-open" markerWidth="8" markerHeight="7" refX="7" refY="3.50" orient="auto" markerUnits="strokeWidth"><path d="M0 0.50 L7 3.50 L0 6.50" fill="none" stroke="#64748b" stroke-width="1.20"/></marker><linearGradient id="fm-node-gradient" x1="0.0%" y1="0.0%" x2="0.0%" y2="100.0%"><stop offset="0.0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="55.0%" stop-color="#ffffff" stop-opacity="0.97"/><stop offset="100.0%" stop-color="#fafbfc" stop-opacity="0.92"/></linearGradient></defs><g id="fm-edge-0" class="fm-edge" data-fm-edge-id="0" role="graphics-symbol" tabindex="0"><path d="M102 112 C102 132.81,102 174.44,102 195.25 C129.81 195.25,185.44 195.25,213.25 195.25 C213.25 216.06,213.25 257.69,213.25 278.50" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="0" marker-end="url(#arrow-end)"/><title>__state_start points to Idle</title></g><g id="fm-edge-1" class="fm-edge-labeled" data-fm-edge-id="1" role="graphics-symbol" tabindex="0"><path d="M207.25 278.50 C207.25 263.50,207.25 233.50,207.25 218.50 C225.69 218.50,262.56 218.50,281 218.50 C281 203.50,281 173.50,281 158.50" stroke-width="1.80" class="fm-edge fm-edge-back" data-fm-edge-id="1" marker-end="url(#arrow-open)" stroke-dasharray="4,4"/><rect x="211.38" y="196.35" width="65.50" height="26.30" fill="#fafbfc" stroke="#94a3b8" stroke-width="0.75" rx="6" ry="6"/><text x="244.12" y="213.57" text-anchor="middle" font-size="12.30" fill="#1e293b" class="edge-label">start</text><title>Idle points to Busy with label: start</title></g><g id="fm-edge-2" class="fm-edge-labeled" data-fm-edge-id="2" role="graphics-symbol" tabindex="0"><path d="M293 158.50 C293 173.50,293 203.50,293 218.50 C274.56 218.50,237.69 218.50,219.25 218.50 C219.25 233.50,219.25 263.50,219.25 278.50" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="2" marker-end="url(#arrow-end)"/><rect x="227.12" y="196.35" width="58" height="26.30" fill="#fafbfc" stroke="#94a3b8" stroke-width="0.75" rx="6" ry="6"/><text x="256.12" y="213.57" text-anchor="middle" font-size="12.30" fill="#1e293b" class="edge-label">done</text><title>Busy points to Idle with label: done</title></g><g id="fm-node-state-start-0" class="fm-node fm-node-accent-4 fm-node-shape-filled-circle" data-id="__state_start" role="graphics-symbol" aria-label="" tabindex="0"><circle cx="102" cy="102" r="10" fill="#cbd5e1"/><text x="102" y="106.60" text-anchor="middle" font-size="13.80" fill="#1e293b"></text><title>Node: __state_start, filled circle</title></g><g id="fm-node-idle-1" class="fm-node fm-node-accent-4 fm-node-shape-rect" data-id="Idle" role="graphics-symbol" aria-label="Idle" tabindex="0"><rect x="163.25" y="278.50" width="100" height="66.50" rx="4.40" fill="url(#fm-node-gradient)"/><text x="213.25" y="316.35" text-anchor="middle" font-size="13.80" fill="#1e293b">Idle</text><title>Node: Idle, rectangle</title></g><g id="fm-node-busy-2" class="fm-node fm-node-accent-1 fm-node-shape-rect" data-id="Busy" role="graphics-symbol" aria-label="Busy" tabindex="0"><rect x="234.50" y="92" width="105" height="66.50" rx="4.40" fill="url(#fm-node-gradient)"/><text x="287" y="129.85" text-anchor="middle" font-size="13.80" fill="#1e293b">Busy</text><title>Node: Busy, rectangle</title></g></svg>