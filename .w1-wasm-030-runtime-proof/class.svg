<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292.3 481.3125" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" role="graphics-document document" aria-roledescription="class" data-nodes="2" data-edges="1" data-type="class" data-detail-tier="normal"><title>class diagram</title><desc>A class diagram with 2 nodes and 1 edge. Flowing top to bottom. Key nodes: Alpha, Beta. Key relationships: Alpha is inherited by Beta. Layout spans 212 by 401 units with 2 rendered node boxes and 1 routed edge path.</desc><style>svg{--fm-bg: #fafbfc;--fm-text-color: #1e293b;--fm-node-fill: #ffffff;--fm-node-stroke: #cbd5e1;--fm-edge-color: #64748b;--fm-cluster-fill: rgba(241,245,249,0.65);--fm-cluster-stroke: #94a3b8;--fm-accent-1: #4f46e5;--fm-accent-4: #7c3aed;--fm-accent-8: #e11d48;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}svg{--fm-edge-muted:var(--fm-cluster-stroke);--fm-edge-label-bg:var(--fm-bg);--fm-edge-label-border:var(--fm-cluster-stroke);--fm-edge-label-text:var(--fm-text-color);--fm-surface-shadow:rgba(15,23,42,.08)}svg{shape-rendering:geometricPrecision;background:var(--fm-bg)}.fm-node{isolation:isolate;--fm-node-accent:var(--fm-node-stroke);--fm-node-hover-accent:var(--fm-edge-color)}.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon{fill:var(--fm-node-fill);stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision;transition:fill 150ms ease,stroke 150ms ease,filter 150ms ease}.fm-node.fm-node-user-mindmap-no-border rect,.fm-node.fm-node-user-mindmap-no-border path,.fm-node.fm-node-user-mindmap-no-border polygon{stroke:none}.fm-node line{stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke}.fm-node text{fill:var(--fm-text-color);font-weight:500;letter-spacing:-.015em;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1,"calt" 1}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke:var(--fm-node-hover-accent);}.fm-node-accent-4{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-4) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-4)}.fm-node-accent-8{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-8) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-8)}.fm-edge{fill:none;stroke:var(--fm-edge-color);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;paint-order:stroke;transition:stroke 150ms ease,opacity 150ms ease,stroke-width 150ms ease;cursor:default}.fm-edge:hover{stroke:var(--fm-accent-1);stroke-width:2.25;opacity:1}.fm-edge-solid{stroke-dasharray:none}.fm-edge-back{stroke:var(--fm-edge-muted);opacity:.8;stroke-dasharray:4 4}.fm-label{fill:var(--fm-text-color)}@media (prefers-reduced-motion:reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition:none;transform:none}}.fm-node:focus-visible{outline:2px solid var(--fm-accent-1);outline-offset:3px}.fm-cluster{fill-opacity: 0.06;}/* High contrast mode support */ @media (prefers-contrast: more){svg,:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{.fm-node text,.fm-edge-labeled text,.fm-cluster-label{font-size: 8.0px !important;fill: #111 !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-edge{stroke: #111 !important;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}#fm-node-gradient stop{stop-color: #fff !important;stop-opacity: 1 !important;}}</style><defs><marker id="start-arrow-triangle-open" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="none" stroke="#64748b" stroke-width="1"/></marker><linearGradient id="fm-node-gradient" x1="0.0%" y1="0.0%" x2="0.0%" y2="100.0%"><stop offset="0.0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="55.0%" stop-color="#ffffff" stop-opacity="0.97"/><stop offset="100.0%" stop-color="#fafbfc" stop-opacity="0.92"/></linearGradient></defs><g id="fm-edge-0" class="fm-edge" data-fm-edge-id="0" role="graphics-symbol" tabindex="0"><path d="M146.15 202.81 L142.85 322.81" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="0" marker-start="url(#start-arrow-triangle-open)"/><title>Alpha is inherited by Beta</title></g><g id="fm-node-alpha-0" class="fm-node fm-node-accent-4 fm-node-shape-rect" data-id="Alpha" role="graphics-symbol" aria-label="Alpha" tabindex="0"><rect x="92" y="92" width="108.30" height="110.81" rx="4.40" fill="url(#fm-node-gradient)"/><text x="146.15" y="112.70" text-anchor="middle" font-size="13.80" font-weight="bold" fill="#1e293b">Alpha</text><line x1="92" y1="123.05" x2="200.30" y2="123.05" stroke-width="1"/><text x="100" y="146.03" text-anchor="start" font-size="12.42" fill="#1e293b">+String name</text><line x1="92" y1="152.24" x2="200.30" y2="152.24" stroke-width="1"/><text x="100" y="175.21" text-anchor="start" font-size="12.42" fill="#1e293b">+run()</text><title>Node: Alpha, rectangle</title></g><g id="fm-node-beta-1" class="fm-node fm-node-accent-8 fm-node-shape-rect" data-id="Beta" role="graphics-symbol" aria-label="Beta" tabindex="0"><rect x="92" y="322.81" width="101.70" height="66.50" rx="4.40" fill="url(#fm-node-gradient)"/><text x="142.85" y="360.66" text-anchor="middle" font-size="13.80" fill="#1e293b">Beta</text><title>Node: Beta, rectangle</title></g></svg>