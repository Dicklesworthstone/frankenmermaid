<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 566.5" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" role="graphics-document document" aria-roledescription="sequence" data-nodes="2" data-edges="2" data-type="sequence" data-detail-tier="rich"><title>sequence diagram</title><desc>A sequence diagram with 2 nodes and 2 edges. Flowing top to bottom. Key nodes: A, B. Key relationships: A points to B with label: hello; B optionally points to A with label: reply. Layout spans 360 by 486 units with 2 rendered node boxes and 2 routed edge paths.</desc><style>svg{--fm-bg: #fafbfc;--fm-text-color: #1e293b;--fm-node-fill: #ffffff;--fm-node-stroke: #cbd5e1;--fm-edge-color: #64748b;--fm-cluster-fill: rgba(241,245,249,0.65);--fm-cluster-stroke: #94a3b8;--fm-accent-1: #4f46e5;--fm-accent-5: #d97706;--fm-accent-6: #db2777;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}svg{--fm-edge-muted:var(--fm-cluster-stroke);--fm-edge-label-bg:var(--fm-bg);--fm-edge-label-border:var(--fm-cluster-stroke);--fm-edge-label-text:var(--fm-text-color);--fm-surface-shadow:rgba(15,23,42,.08)}svg{shape-rendering:geometricPrecision;background:var(--fm-bg)}.fm-node{isolation:isolate;--fm-node-accent:var(--fm-node-stroke);--fm-node-hover-accent:var(--fm-edge-color)}.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon{fill:var(--fm-node-fill);stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision;transition:fill 150ms ease,stroke 150ms ease,filter 150ms ease}.fm-node.fm-node-user-mindmap-no-border rect,.fm-node.fm-node-user-mindmap-no-border path,.fm-node.fm-node-user-mindmap-no-border polygon{stroke:none}.fm-node line{stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke}.fm-node text{fill:var(--fm-text-color);font-weight:500;letter-spacing:-.015em;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1,"calt" 1}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke:var(--fm-node-hover-accent);}.fm-node-accent-5{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-5) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-5)}.fm-node-accent-6{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-6) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-6)}.fm-edge{fill:none;stroke:var(--fm-edge-color);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;paint-order:stroke;transition:stroke 150ms ease,opacity 150ms ease,stroke-width 150ms ease;cursor:default}.fm-edge:hover{stroke:var(--fm-accent-1);stroke-width:2.25;opacity:1}.fm-edge-solid{stroke-dasharray:none}.fm-edge-dashed{stroke-dasharray:5 5}.fm-edge-thick{stroke-width:2.25}.fm-edge-thick:hover{stroke-width:3}.fm-edge-back{stroke:var(--fm-edge-muted);opacity:.8;stroke-dasharray:4 4}marker#arrow-end path{fill:var(--fm-edge-color);stroke:none;transition:fill 150ms ease}.fm-edge:hover~marker#arrow-end path{fill:var(--fm-accent-1)}.fm-label{fill:var(--fm-text-color)}@media (prefers-reduced-motion:reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition:none;transform:none}}.fm-node:focus-visible{outline:2px solid var(--fm-accent-1);outline-offset:3px}.fm-edge-labeled > rect{fill: var(--fm-edge-label-bg);stroke: var(--fm-edge-label-border);stroke-width: 0.85;rx: 6px;ry: 6px;}@supports (backdrop-filter: blur(4px)){.fm-edge-labeled > rect{fill: color-mix(in srgb,var(--fm-edge-label-bg) 90%,transparent);backdrop-filter: blur(8px);}}.edge-label{fill: var(--fm-edge-label-text);font-weight: 500;font-size: 0.85em;letter-spacing: -0.01em;text-rendering: optimizeLegibility;}.fm-cluster{fill-opacity: 0.06;}/* High contrast mode support */ @media (prefers-contrast: more){svg,:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{.fm-node text,.fm-edge-labeled text,.fm-cluster-label{font-size: 8.0px !important;fill: #111 !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-edge{stroke: #111 !important;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}#fm-node-gradient stop{stop-color: #fff !important;stop-opacity: 1 !important;}}</style><defs><marker id="arrow-end" markerWidth="8" markerHeight="7" refX="8" refY="3.50" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.50 L0 7 L2 3.50 Z" fill="#64748b"/></marker><linearGradient id="fm-node-gradient" x1="0.0%" y1="0.0%" x2="0.0%" y2="100.0%"><stop offset="0.0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="55.0%" stop-color="#ffffff" stop-opacity="0.97"/><stop offset="100.0%" stop-color="#fafbfc" stop-opacity="0.92"/></linearGradient></defs><g class="fm-band fm-band-lane"><rect x="89" y="106.50" width="2" height="420" rx="8" fill="rgba(196,181,253,0.14)" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="6,4" fill-opacity="0.80" stroke-opacity="0.90"/><text x="97" y="122.50" text-anchor="start" font-size="12.30" fill="var(--fm-text-color, #4a5568)" class="fm-band-label">A</text></g><g class="fm-band fm-band-lane"><rect x="349" y="106.50" width="2" height="420" rx="8" fill="rgba(196,181,253,0.14)" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="6,4" fill-opacity="0.80" stroke-opacity="0.90"/><text x="357" y="122.50" text-anchor="start" font-size="12.30" fill="var(--fm-text-color, #4a5568)" class="fm-band-label">B</text></g><g id="fm-edge-0" class="fm-edge-labeled" data-fm-edge-id="0" role="graphics-symbol" tabindex="0"><path d="M90 226.50 L350 226.50" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="0" marker-end="url(#arrow-end)"/><rect x="187.25" y="204.12" width="65.50" height="26.75" fill="#fafbfc" stroke="#94a3b8" stroke-width="0.75" rx="6" ry="6"/><text x="220" y="221.69" text-anchor="middle" font-size="12.75" fill="#1e293b" class="edge-label">hello</text><title>A points to B with label: hello</title></g><g id="fm-edge-1" class="fm-edge-labeled" data-fm-edge-id="1" role="graphics-symbol" tabindex="0"><path d="M350 346.50 L90 346.50" stroke-width="1.80" class="fm-edge fm-edge-dashed" data-fm-edge-id="1" marker-end="url(#arrow-end)" stroke-dasharray="5,5"/><rect x="187.25" y="324.12" width="65.50" height="26.75" fill="#fafbfc" stroke="#94a3b8" stroke-width="0.75" rx="6" ry="6"/><text x="220" y="341.69" text-anchor="middle" font-size="12.75" fill="#1e293b" class="edge-label">reply</text><title>B optionally points to A with label: reply</title></g><g id="fm-node-a-0" class="fm-node fm-node-accent-5 fm-node-shape-rect fm-node-user-sequence-participant" data-id="A" role="graphics-symbol" aria-label="A" tabindex="0"><rect x="40" y="40" width="100" height="66.50" rx="4.40" fill="url(#fm-node-gradient)"/><text x="90" y="78.25" text-anchor="middle" font-size="15" fill="#1e293b">A</text><title>Node: A, rectangle</title></g><g id="fm-node-b-1" class="fm-node fm-node-accent-6 fm-node-shape-rect fm-node-user-sequence-participant" data-id="B" role="graphics-symbol" aria-label="B" tabindex="0"><rect x="300" y="40" width="100" height="66.50" rx="4.40" fill="url(#fm-node-gradient)"/><text x="350" y="78.25" text-anchor="middle" font-size="15" fill="#1e293b">B</text><title>Node: B, rectangle</title></g></svg>