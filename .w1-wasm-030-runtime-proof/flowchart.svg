<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 479.775 810" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" role="graphics-document document" aria-roledescription="flowchart-v2" data-nodes="5" data-edges="4" data-type="flowchart" data-detail-tier="rich"><title>flowchart diagram</title><desc>A flowchart diagram with 5 nodes and 4 edges. Flowing top to bottom. Key nodes: Alpha, Beta, Gamma. Key relationships: Alpha points to Beta; Beta points to Gamma; Gamma optionally connects to a. Layout spans 400 by 730 units with 5 rendered node boxes and 4 routed edge paths.</desc><style>svg{--fm-bg: #fafbfc;--fm-text-color: #1e293b;--fm-node-fill: #ffffff;--fm-node-stroke: #cbd5e1;--fm-edge-color: #64748b;--fm-cluster-fill: rgba(241,245,249,0.65);--fm-cluster-stroke: #94a3b8;--fm-accent-1: #4f46e5;--fm-accent-3: #0d9488;--fm-accent-4: #7c3aed;--fm-accent-5: #d97706;--fm-accent-6: #db2777;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}svg{--fm-edge-muted:var(--fm-cluster-stroke);--fm-edge-label-bg:var(--fm-bg);--fm-edge-label-border:var(--fm-cluster-stroke);--fm-edge-label-text:var(--fm-text-color);--fm-surface-shadow:rgba(15,23,42,.08)}svg{shape-rendering:geometricPrecision;background:var(--fm-bg)}.fm-node{isolation:isolate;--fm-node-accent:var(--fm-node-stroke);--fm-node-hover-accent:var(--fm-edge-color)}.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon{fill:var(--fm-node-fill);stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision;transition:fill 150ms ease,stroke 150ms ease,filter 150ms ease}.fm-node.fm-node-user-mindmap-no-border rect,.fm-node.fm-node-user-mindmap-no-border path,.fm-node.fm-node-user-mindmap-no-border polygon{stroke:none}.fm-node line{stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke}.fm-node text{fill:var(--fm-text-color);font-weight:500;letter-spacing:-.015em;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1,"calt" 1}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke:var(--fm-node-hover-accent);}.fm-node-accent-1{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-1) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-1)}.fm-node-accent-3{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-3) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-3)}.fm-node-accent-4{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-4) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-4)}.fm-node-accent-5{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-5) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-5)}.fm-node-accent-6{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-6) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-6)}.fm-edge{fill:none;stroke:var(--fm-edge-color);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;paint-order:stroke;transition:stroke 150ms ease,opacity 150ms ease,stroke-width 150ms ease;cursor:default}.fm-edge:hover{stroke:var(--fm-accent-1);stroke-width:2.25;opacity:1}.fm-edge-solid{stroke-dasharray:none}.fm-edge-dashed{stroke-dasharray:5 5}.fm-edge-thick{stroke-width:2.25}.fm-edge-thick:hover{stroke-width:3}.fm-edge-back{stroke:var(--fm-edge-muted);opacity:.8;stroke-dasharray:4 4}marker#arrow-end path{fill:var(--fm-edge-color);stroke:none;transition:fill 150ms ease}.fm-edge:hover~marker#arrow-end path{fill:var(--fm-accent-1)}.fm-label{fill:var(--fm-text-color)}@media (prefers-reduced-motion:reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition:none;transform:none}}.fm-node:focus-visible{outline:2px solid var(--fm-accent-1);outline-offset:3px}.fm-node-inactive{opacity: 0.40;}.fm-cluster{fill-opacity: 0.06;}/* High contrast mode support */ @media (prefers-contrast: more){svg,:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{.fm-node text,.fm-edge-labeled text,.fm-cluster-label{font-size: 8.0px !important;fill: #111 !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-edge{stroke: #111 !important;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}#fm-node-gradient stop{stop-color: #fff !important;stop-opacity: 1 !important;}}</style><defs><marker id="arrow-end" markerWidth="8" markerHeight="7" refX="8" refY="3.50" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.50 L0 7 L2 3.50 Z" fill="#64748b"/></marker><linearGradient id="fm-node-gradient" x1="0.0%" y1="0.0%" x2="0.0%" y2="100.0%"><stop offset="0.0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="55.0%" stop-color="#ffffff" stop-opacity="0.97"/><stop offset="100.0%" stop-color="#fafbfc" stop-opacity="0.92"/></linearGradient></defs><g id="fm-edge-0" class="fm-edge" data-fm-edge-id="0" role="graphics-symbol" tabindex="0"><path d="M241.54 158.50 L238.24 278.50" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="0" marker-end="url(#arrow-end)"/><title>Alpha points to Beta</title></g><g id="fm-edge-1" class="fm-edge" data-fm-edge-id="1" role="graphics-symbol" tabindex="0"><path d="M238.24 345 C238.24 360,238.24 390,238.24 405 C216.25 405,172.27 405,150.27 405 C150.27 420,150.27 450,150.27 465" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="1" marker-end="url(#arrow-end)"/><title>Beta points to Gamma</title></g><g id="fm-edge-2" class="fm-edge" data-fm-edge-id="2" role="graphics-symbol" tabindex="0"><path d="M150.27 531.50 C150.27 546.50,150.27 576.50,150.27 591.50 C148.21 591.50,144.07 591.50,142 591.50 C142 606.50,142 636.50,142 651.50" stroke-width="1.80" class="fm-edge fm-edge-dashed" data-fm-edge-id="2" stroke-dasharray="5,5"/><title>Gamma optionally connects to a</title></g><g id="fm-edge-3" class="fm-edge" data-fm-edge-id="3" role="graphics-symbol" tabindex="0"><path d="M238.24 345 C238.24 360,238.24 390,238.24 405 C262.50 405,311.02 405,335.27 405 C335.27 420,335.27 450,335.27 465" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="3" marker-end="url(#arrow-end)"/><title>Beta points to Delta</title></g><g id="fm-node-a-0" class="fm-node fm-node-accent-5 fm-node-shape-rect" data-id="a" role="graphics-symbol" aria-label="Alpha" tabindex="0"><rect x="187.39" y="92" width="108.30" height="66.50" rx="4.40" fill="url(#fm-node-gradient)"/><text x="241.54" y="130.25" text-anchor="middle" font-size="15" fill="#1e293b">Alpha</text><title>Node: Alpha, rectangle</title></g><g id="fm-node-b-1" class="fm-node fm-node-accent-6 fm-node-shape-rect" data-id="b" role="graphics-symbol" aria-label="Beta" tabindex="0"><rect x="187.39" y="278.50" width="101.70" height="66.50" rx="4.40" fill="url(#fm-node-gradient)"/><text x="238.24" y="316.75" text-anchor="middle" font-size="15" fill="#1e293b">Beta</text><title>Node: Beta, rectangle</title></g><g id="fm-node-c-2" class="fm-node fm-node-accent-3 fm-node-shape-rect" data-id="c" role="graphics-symbol" aria-label="Gamma" tabindex="0"><rect x="92" y="465" width="116.55" height="66.50" rx="4.40" fill="url(#fm-node-gradient)"/><text x="150.27" y="503.25" text-anchor="middle" font-size="15" fill="#1e293b">Gamma</text><title>Node: Gamma, rectangle</title></g><g id="fm-node-3" class="fm-node fm-node-accent-1 fm-node-shape-asymmetric" data-id="-" role="graphics-symbol" aria-label="a" tabindex="0"><path d="M92 651.50 L177 651.50 L192 684.75 L177 718 L92 718 Z" fill="url(#fm-node-gradient)"/><text x="142" y="689.75" text-anchor="middle" font-size="15" fill="#1e293b">a</text><title>Node: a, flag shape</title></g><g id="fm-node-d-4" class="fm-node fm-node-accent-4 fm-node-shape-rect" data-id="d" role="graphics-symbol" aria-label="Delta" tabindex="0"><rect x="282.77" y="465" width="105" height="66.50" rx="4.40" fill="url(#fm-node-gradient)"/><text x="335.27" y="503.25" text-anchor="middle" font-size="15" fill="#1e293b">Delta</text><title>Node: Delta, rectangle</title></g></svg>