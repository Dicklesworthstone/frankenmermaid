name: FrankenMermaid
options:
  bundleIdPrefix: com.frankenmermaid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: AU8V2Z6NKY
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

schemes:
  FrankenMermaid:
    build:
      targets:
        FrankenMermaid: all
        FrankenMermaidTests: [test]
        FrankenMermaidUITests: [test]
    test:
      targets:
        - FrankenMermaidTests
        - FrankenMermaidUITests

targets:
  FrankenMermaid:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankenmermaid.FrankenMermaid
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: true
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: false
        MACCATALYST_USE_NATIVE_DESIGN: true
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Renderer
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Stage tracked renderer package
        script: '"${SRCROOT}/stage-renderer.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Renderer"'
        inputFiles:
          - $(SRCROOT)/../pkg/frankenmermaid.js
          - $(SRCROOT)/../pkg/frankenmermaid_bg.wasm
          - $(SRCROOT)/../pkg/frankenmermaid.d.ts
          - $(SRCROOT)/../crates/fm-cli/src/deck_runtime.js
          - $(SRCROOT)/../crates/fm-cli/src/deck_template.html
          - $(SRCROOT)/Renderer/RendererManifest.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Renderer/frankenmermaid.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Renderer/frankenmermaid_bg.wasm
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Renderer/frankenmermaid.d.ts
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Renderer/deck_runtime.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Renderer/deck_template.html
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Renderer/RendererManifest.json
    entitlements:
      path: FrankenMermaid.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.frankenmermaid.FrankenMermaid
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FrankenMermaid
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        CFBundleDocumentTypes:
          - CFBundleTypeName: Mermaid Diagram
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.frankenmermaid.source
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.frankenmermaid.source
            UTTypeDescription: Mermaid Diagram Source
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - mmd
                - mermaid
              public.mime-type: text/plain
        CFBundleURLTypes:
          - CFBundleURLName: com.frankenmermaid.FrankenMermaid
            CFBundleURLSchemes:
              - frankenmermaid
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.developer-tools
  FrankenMermaidUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: FrankenMermaid
    sources:
      - UITests
    dependencies:
      - target: FrankenMermaid
  FrankenMermaidTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    sources:
      - Tests
    dependencies:
      - target: FrankenMermaid
