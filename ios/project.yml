name: FrankenMermaid
options:
  bundleIdPrefix: com.frankenmermaid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: AU8V2Z6NKY
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  FrankenMermaid:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankenmermaid.FrankenMermaid
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: true
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: false
        MACCATALYST_USE_NATIVE_DESIGN: true
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Renderer
        type: folder
        buildPhase: resources
    entitlements:
      path: FrankenMermaid.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.frankenmermaid.FrankenMermaid
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FrankenMermaid
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        CFBundleDocumentTypes:
          - CFBundleTypeName: Mermaid Diagram
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.plain-text
        CFBundleURLTypes:
          - CFBundleURLName: com.frankenmermaid.FrankenMermaid
            CFBundleURLSchemes:
              - frankenmermaid
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.developer-tools

