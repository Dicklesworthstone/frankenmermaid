<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' frankenmermaid-resource:; connect-src frankenmermaid-resource:; style-src 'unsafe-inline'; img-src data: blob:">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; width: 100%; height: 100%; background: #061116; }
    body { display: grid; place-items: center; overflow: auto; }
    #stage { width: 100%; height: 100%; min-width: 0; min-height: 0; overflow: hidden; display: grid; place-items: center; padding: 18px; box-sizing: border-box; }
    #stage > svg { width: 100% !important; height: 100% !important; max-width: 100%; max-height: 100%; filter: drop-shadow(0 12px 28px rgba(34,211,238,.12)); }
    #stage.fm-deck-stage { position: relative; display: block; padding: 0; touch-action: none; cursor: grab; outline: none; }
    #stage .fm-lens-selected { filter: drop-shadow(0 0 8px rgba(251,191,36,.82)); }
    #stage .fm-lens-selected :is(rect,path,circle,ellipse,polygon,line,polyline) { stroke: #fbbf24 !important; stroke-width: 3 !important; }
  </style>
</head>
<body>
  <main id="stage" aria-label="Rendered Mermaid diagram"></main>
  <script src="./deck_runtime.js"></script>
  <script type="module">
    import init, { applyLensEdit, describeDiagram, detectType, diagramLens, parse, renderDeck } from './frankenmermaid.js';
    const bridge = window.webkit.messageHandlers.frankenBridge;
    const stage = document.querySelector('#stage');
    let latestRequest = 0;
    let latestSource = '';
    let latestDeck = null;
    let deckController = null;
    let deckChrome = null;
    let deckObserver = null;
    const deckTemplatePromise = fetch('./deck_template.html').then((response) => {
      if (!response.ok) throw new Error('The bundled Graph Deck template is unavailable.');
      return response.text();
    });
    const deckRuntimePromise = fetch('./deck_runtime.js').then((response) => {
      if (!response.ok) throw new Error('The bundled Graph Deck runtime is unavailable.');
      return response.text();
    });

    function deckSummary(manifest) {
      if (!manifest || !Array.isArray(manifest.slides) || manifest.slides.length === 0) return null;
      const overviewEnabled = manifest.overview?.enabled !== false;
      return {
        title: String(manifest.title || 'Graph Deck'),
        slideCount: manifest.slides.length,
        sceneCount: manifest.slides.length + (overviewEnabled ? 1 : 0),
        overviewEnabled
      };
    }

    function deckState(presented = Boolean(deckController)) {
      return {
        type: 'deck.state',
        requestID: latestRequest,
        presented,
        title: String(deckChrome?.title?.textContent || latestDeck?.summary?.title || 'Graph Deck'),
        caption: String(deckChrome?.caption?.textContent || ''),
        position: String(deckChrome?.num?.textContent || '')
      };
    }

    function publishDeckState() {
      bridge.postMessage(deckState());
    }

    function stopDeck(restoreDiagram) {
      deckObserver?.disconnect();
      deckObserver = null;
      deckController?.destroy();
      deckController = null;
      deckChrome = null;
      stage.classList.remove('fm-deck-stage');
      stage.removeAttribute('tabindex');
      stage.textContent = '';
      if (restoreDiagram && latestDeck?.svg) {
        stage.innerHTML = latestDeck.svg;
        installSourceLens(latestSource, latestRequest);
      }
      bridge.postMessage(deckState(false));
    }

    function startDeck() {
      if (!latestDeck?.manifest || !latestDeck?.summary) {
        throw new Error('Add a valid %%{deck: …}%% directive before starting a presentation.');
      }
      if (deckController) return deckState(true);
      if (!window.FmDeckRuntime?.mount) {
        throw new Error('The canonical Graph Deck runtime did not load.');
      }
      stage.textContent = '';
      stage.classList.add('fm-deck-stage');
      stage.setAttribute('tabindex', '0');
      deckChrome = {
        title: document.createElement('span'),
        caption: document.createElement('span'),
        num: document.createElement('span')
      };
      deckObserver = new MutationObserver(publishDeckState);
      Object.values(deckChrome).forEach((element) => {
        deckObserver.observe(element, {childList: true, characterData: true, subtree: true});
      });
      deckController = window.FmDeckRuntime.mount({
        stage,
        svg: latestDeck.svg,
        manifest: latestDeck.manifest,
        ui: deckChrome,
        onSlideChange: () => queueMicrotask(publishDeckState)
      });
      stage.focus();
      publishDeckState();
      return deckState(true);
    }

    function guardInlineScript(value) {
      return String(value).replaceAll('</', '<\\/');
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    async function standaloneDeckDocument() {
      if (!latestDeck?.manifest || !latestDeck?.summary) {
        throw new Error('This diagram has no usable Graph Deck manifest to export.');
      }
      const [template, runtime] = await Promise.all([deckTemplatePromise, deckRuntimePromise]);
      return template
        .replace('{{TITLE}}', escapeHTML(latestDeck.summary.title))
        .replace('{{BG}}', '#061116')
        .replace('{{FG}}', '#e7eef0')
        .replace('{{MANIFEST_JSON}}', guardInlineScript(JSON.stringify(latestDeck.manifest)))
        .replace('{{RUNTIME_JS}}', runtime)
        .replace('{{SVG_JS_STRING}}', guardInlineScript(JSON.stringify(latestDeck.svg)));
    }

    function publishLensSelection(requestID, binding) {
      stage.querySelectorAll('.fm-lens-selected').forEach((element) => {
        element.classList.remove('fm-lens-selected');
        element.removeAttribute('aria-current');
      });
      if (binding) {
        const selected = document.getElementById(binding.elementId);
        selected?.classList.add('fm-lens-selected');
        selected?.setAttribute('aria-current', 'true');
      }
      bridge.postMessage({type: 'lens.selection', requestID, binding: binding || null});
    }

    function installSourceLens(source, requestID) {
      const bindings = Array.from(diagramLens(source) || []);
      const bindingsByElement = new Map(bindings.map((binding) => [binding.elementId, binding]));
      for (const element of stage.querySelectorAll('[id^="fm-node-"], [id^="fm-edge-"], [id^="fm-cluster-"]')) {
        const binding = bindingsByElement.get(element.id);
        if (!binding) continue;
        const kind = String(binding.kind || 'element').trim().toLowerCase();
        const identity = String(binding.sourceId || binding.snippet || binding.elementId)
          .trim().replace(/\s+/g, ' ').slice(0, 96);
        element.setAttribute('tabindex', '0');
        element.setAttribute('role', 'button');
        element.setAttribute('aria-label', `Diagram ${kind} ${identity}`);
        const select = (event) => {
          event.stopPropagation();
          publishLensSelection(requestID, binding);
        };
        element.addEventListener('click', select);
        element.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            select(event);
          }
        });
      }
      return bindings.length;
    }

    stage.addEventListener('click', (event) => {
      if (event.target === stage) publishLensSelection(latestRequest, null);
    });

    function inspectDiagram(source) {
      const parsed = parse(source);
      const diagnostics = Array.from(parsed?.ir?.diagnostics || []).map((diagnostic) => ({
        severity: String(diagnostic?.severity || 'info').toLowerCase(),
        category: String(diagnostic?.category || 'parser').toLowerCase(),
        message: String(diagnostic?.message || 'The parser reported an issue.'),
        suggestion: diagnostic?.suggestion ? String(diagnostic.suggestion) : '',
        line: Number(diagnostic?.span?.start?.line || 0),
        column: Number(diagnostic?.span?.start?.col || 0)
      }));
      for (const warning of Array.from(parsed?.warnings || [])) {
        const message = String(warning);
        if (!diagnostics.some((diagnostic) => diagnostic.message === message)) {
          diagnostics.push({
            severity: 'warning', category: 'recovery', message,
            suggestion: '', line: 0, column: 0
          });
        }
      }
      return {
        accessibilitySummary: describeDiagram(source),
        diagnostics
      };
    }

    function serializedDiagram() {
      const rendered = stage.querySelector('svg');
      if (!rendered) throw new Error('Render a diagram before sharing it.');
      const copy = rendered.cloneNode(true);
      copy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      copy.setAttribute('width', '100%');
      copy.setAttribute('height', '100%');
      copy.querySelectorAll('style').forEach((style) => {
        style.textContent = style.textContent.replace(/@import\s+url\([^)]*\)[^;]*;/g, '');
      });
      copy.querySelectorAll('[id^="fm-node-"]').forEach((node, index) => {
        node.style.setProperty('--i', String(index));
      });
      return new XMLSerializer().serializeToString(copy);
    }

    function animatedDocument(svg, title) {
      const safeTitle = String(title || 'FrankenMermaid Diagram')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
      return `<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>${safeTitle}</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020a08;color:#e7eef0}
body{display:grid;place-items:center;padding:clamp(16px,4vw,56px);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:radial-gradient(circle at 20% 10%,#0e749044,transparent 45%),radial-gradient(circle at 80% 90%,#10b98126,transparent 48%),#020a08}
main{width:min(1400px,100%);height:min(88vh,960px);padding:clamp(12px,2vw,28px);border:1px solid #22d3ee42;border-radius:28px;background:#030d0dcc;box-shadow:0 28px 90px #000b,0 0 64px #22d3ee18;overflow:hidden}
svg{width:100%!important;height:100%!important;max-width:100%;max-height:100%;filter:drop-shadow(0 14px 34px #22d3ee22)}
[id^="fm-edge-"] path,[id^="fm-edge-"] line,[id^="fm-edge-"] polyline{stroke-dasharray:10 8;animation:current 1.35s linear infinite}
[id^="fm-node-"]{animation:nodeCharge 3.2s ease-in-out infinite;animation-delay:calc(var(--i,0)*45ms)}
@keyframes current{to{stroke-dashoffset:-36}}
@keyframes nodeCharge{0%,100%{opacity:.86;filter:drop-shadow(0 0 0 #22d3ee00)}50%{opacity:1;filter:drop-shadow(0 0 7px #22d3ee80)}}
@media(prefers-reduced-motion:reduce){[id^="fm-edge-"] path,[id^="fm-edge-"] line,[id^="fm-edge-"] polyline,[id^="fm-node-"]{animation:none}}
</style></head><body><main aria-label="Animated FrankenMermaid diagram">${svg}</main></body></html>`;
    }

    try {
      const wasmResponse = await fetch('./frankenmermaid_bg.wasm');
      const wasmBytes = await wasmResponse.arrayBuffer();
      await init({module_or_path: wasmBytes});
      window.frankenRender = async (command) => {
        const requestID = Number(command.requestID);
        latestRequest = Math.max(latestRequest, requestID);
        const started = performance.now();
        try {
          const source = String(command.source);
          if (deckController) stopDeck(false);
          const deckOutput = renderDeck(
            source,
            command.options || {theme: 'dark', responsive: true, accessible: true}
          );
          const svg = String(deckOutput?.svg || '');
          if (!svg.startsWith('<svg')) throw new Error('The renderer returned an invalid SVG artifact.');
          if (requestID !== latestRequest) return false;
          latestSource = source;
          const summary = deckSummary(deckOutput?.manifest);
          latestDeck = summary ? {svg, manifest: deckOutput.manifest, summary} : null;
          const insight = inspectDiagram(source);
          for (const warning of Array.from(deckOutput?.warnings || [])) {
            const message = String(warning?.message || warning);
            if (!insight.diagnostics.some((diagnostic) => diagnostic.message === message)) {
              insight.diagnostics.push({
                severity: 'warning', category: 'deck', message,
                suggestion: '', line: 0, column: 0
              });
            }
          }
          if (requestID !== latestRequest) return false;
          stage.innerHTML = svg;
          const lensBindingCount = installSourceLens(source, requestID);
          const typeResult = detectType(source);
          const diagramType = typeof typeResult === 'string'
            ? typeResult
            : String(typeResult?.diagram_type ?? typeResult?.type ?? 'diagram');
          bridge.postMessage({
            type: 'result', requestID,
            elapsedMS: performance.now() - started,
            diagramType,
            nodeCount: stage.querySelectorAll('[id^="fm-node-"]').length,
            edgeCount: stage.querySelectorAll('[id^="fm-edge-"]').length,
            lensBindingCount,
            deck: summary,
            accessibilitySummary: insight.accessibilitySummary,
            diagnostics: insight.diagnostics
          });
          return true;
        } catch (error) {
          bridge.postMessage({type: 'failure', requestID, message: String(error)});
          return false;
        }
      };
      window.frankenApplyLensEdit = (command) => {
        const requestID = Number(command.requestID);
        const source = String(command.source ?? '');
        const elementID = String(command.elementID ?? '');
        const replacement = String(command.replacement ?? '');
        if (!Number.isSafeInteger(requestID) || requestID !== latestRequest) {
          throw new Error('The selected element belongs to an older render. Select it again.');
        }
        if (source !== latestSource) {
          throw new Error('The Mermaid source changed after this element was selected. Select it again.');
        }
        if (!elementID || !replacement.trim()) {
          throw new Error('Choose a source-bound element and enter a non-empty replacement.');
        }
        if (new TextEncoder().encode(replacement).byteLength > 4096) {
          throw new Error('A source-lens replacement cannot exceed 4 KB.');
        }
        const result = applyLensEdit(source, elementID, replacement);
        const updatedSource = String(result?.updatedSource ?? '');
        if (result?.elementId !== elementID || !updatedSource) {
          throw new Error('The Rust source lens returned an invalid edit receipt.');
        }
        if (new TextEncoder().encode(updatedSource).byteLength > 2 * 1024 * 1024) {
          throw new Error('The edit would exceed the 2 MB editor limit.');
        }
        return {
          requestID,
          elementID,
          updatedSource,
          previousSnippet: String(result.previousSnippet ?? ''),
          replacement: String(result.replacement ?? '')
        };
      };
      window.frankenDeck = (command) => {
        const action = String(command?.action || '');
        if (action === 'start') return startDeck();
        if (action === 'stop') {
          stopDeck(true);
          return deckState(false);
        }
        if (!deckController) throw new Error('Start the Graph Deck before navigating it.');
        if (action === 'next') deckController.next();
        else if (action === 'previous') deckController.prev();
        else if (action === 'overview') deckController.overview();
        else if (action === 'first') deckController.go(0);
        else throw new Error('Unknown Graph Deck command.');
        publishDeckState();
        return deckState(true);
      };
      async function pngDataURL(svg) {
        const document = new DOMParser().parseFromString(svg, 'image/svg+xml');
        const root = document.documentElement;
        if (!root || root.nodeName.toLowerCase() !== 'svg') throw new Error('invalid SVG export');
        const viewBox = (root.getAttribute('viewBox') || '').trim().split(/[ ,]+/).map(Number);
        const rawWidth = Number.parseFloat(root.getAttribute('width'));
        const rawHeight = Number.parseFloat(root.getAttribute('height'));
        const hasViewBox = viewBox.length === 4 && viewBox.every(Number.isFinite) && viewBox[2] > 0 && viewBox[3] > 0;
        const width = hasViewBox ? viewBox[2] : rawWidth;
        const height = hasViewBox ? viewBox[3] : rawHeight;
        if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 0 || height <= 0) {
          throw new Error('diagram has no rasterizable dimensions');
        }
        const scale = Math.min(2, 4096 / Math.max(width, height), Math.sqrt(16000000 / (width * height)));
        if (!Number.isFinite(scale) || scale <= 0) throw new Error('diagram is too large to rasterize');
        const canvas = window.document.createElement('canvas');
        canvas.width = Math.max(1, Math.ceil(width * scale));
        canvas.height = Math.max(1, Math.ceil(height * scale));
        const context = canvas.getContext('2d');
        if (!context) throw new Error('PNG canvas is unavailable');
        const blobURL = URL.createObjectURL(new Blob([svg], {type: 'image/svg+xml;charset=utf-8'}));
        try {
          const image = new Image();
          image.src = blobURL;
          await image.decode();
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          return canvas.toDataURL('image/png');
        } finally {
          URL.revokeObjectURL(blobURL);
        }
      }

      window.frankenExport = async (command) => {
        if (command.kind === 'deckHTML') return standaloneDeckDocument();
        const svg = serializedDiagram();
        if (command.kind === 'animatedHTML') {
          return animatedDocument(svg, command.title);
        }
        if (command.kind === 'png') return pngDataURL(svg);
        return svg;
      };
      bridge.postMessage({type: 'ready'});
    } catch (error) {
      bridge.postMessage({type: 'failure', message: `WASM initialization failed: ${error}`});
    }
  </script>
</body>
</html>
