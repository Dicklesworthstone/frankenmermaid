<!doctype html>
<meta charset="utf-8" />
<title>frankenmermaid — worker playground</title>
<!--
  Sample integration for bd-2u0.6 scope item 5.

  Worker requests use the Rust coordinator's protocol, with diagnostics and timings forwarded
  unchanged. The page reports its actual rendering target and falls back to main-thread SVG when
  workers cannot run. Main-thread rendering is synchronous; it is not an off-thread measurement.

  Serve the repository root over HTTP; ES module workers and wasm do not load from file:// URLs.
-->
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
  textarea { font: 13px/1.4 ui-monospace, monospace; border: 0; border-right: 1px solid #cbd5e1; padding: 12px; resize: none; }
  #right { display: flex; flex-direction: column; min-width: 0; }
  #status { padding: 8px 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 12px; }
  #out { flex: 1; overflow: auto; padding: 12px; }
  #log { height: 30%; overflow: auto; border-top: 1px solid #e2e8f0; padding: 8px 12px; font: 12px ui-monospace, monospace; background: #0f172a; color: #e2e8f0; }
  .warn { color: #fbbf24; }
  .err { color: #f87171; }
  #editor-toolbar, #source-editor { padding: 8px 12px; border-bottom: 1px solid #cbd5e1; }
  #source-editor { max-height: 40vh; overflow: auto; }
  #source-editor label, #source-editor select, #source-editor textarea { display: block; width: 100%; box-sizing: border-box; }
  #source-editor textarea { border: 1px solid #cbd5e1; }
  #deck-editor { padding: 8px 12px; border-bottom: 1px solid #cbd5e1; flex-shrink: 0; }
  #deck-editor-preview iframe { display: block; box-sizing: border-box; }
  #deck-editor pre { overflow: auto; }
  #out [data-source-editable] { cursor: pointer; }
  #out [data-source-selected], #out [data-source-editable]:focus { outline: 3px solid #2563eb; outline-offset: 3px; }
</style>

<textarea id="src" spellcheck="false">flowchart TD
  a[Alpha] --> b[Beta]
  b --> c[Gamma]
  c -.-> a</textarea>

<div id="right">
  <div id="status" role="status">starting…</div>
  <div id="editor-toolbar">
    <button id="edit-source" type="button">Edit diagram source (SVG)</button>
    <button id="edit-deck" type="button">Present / export graph deck</button>
  </div>
  <section id="source-editor" aria-label="Diagram source editor" hidden></section>
  <section id="deck-editor" aria-label="Graph deck authoring" hidden></section>
  <div id="out"><canvas id="canvas" width="1200" height="900"></canvas></div>
  <div id="log"></div>
</div>

<script type="module">
  const srcEl = document.getElementById("src");
  const outEl = document.getElementById("out");
  const logEl = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const canvasEl = document.getElementById("canvas");

  // This page lives in `web/`, while the shipped wasm-bindgen package is rooted at `pkg/`.
  const MODULE_URL = new URL("../pkg/frankenmermaid.js", import.meta.url).href;
  const INIT_TIMEOUT_MS = 10000;
  let worker = null;
  let workerReady = false;
  let initTimer = null;
  let mainThread = false;
  let mainModulePromise = null;
  let disposed = false;
  let nextRequestId = 1;
  let liveRequestId = 0;
  let startedAt = 0;
  let sourceEditor = null;
  let deckEditor = null;

  function log(text, cls) {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = text;
    logEl.append(line);
    while (logEl.childElementCount > 200) logEl.firstElementChild.remove();
    logEl.scrollTop = logEl.scrollHeight;
  }

  function receive(msg) {
    // The Rust coordinator owns render scheduling. This is the UI commit boundary: a response
    // already in transit must not replace the preview after a newer edit, even before it renders.
    if (disposed || msg.requestId !== liveRequestId) return;
    const roundTrip = Math.round(performance.now() - startedAt);
    switch (msg.kind) {
      case "completed":
        if (typeof msg.svg === "string") outEl.innerHTML = msg.svg;
        log(
          `#${msg.requestId} completed in ${roundTrip}ms` +
            (msg.timings ? ` (parse ${msg.timings.parseMs}ms, layout ${msg.timings.layoutMs}ms, render ${msg.timings.renderMs}ms)` : "") +
            (msg.nodeCount !== undefined ? ` — ${msg.nodeCount} nodes, ${msg.edgeCount} edges` : ""),
        );
        for (const d of msg.diagnostics || []) log(`  ${d.severity}: ${d.message}`, "warn");
        break;
      case "noReply":
        log(`#${msg.requestId} superseded`, "warn");
        break;
      case "failed":
        log(`#${msg.requestId} failed: ${msg.reason}`, "err");
        break;
      default:
        log(`unexpected message: ${JSON.stringify(msg)}`, "err");
    }
  }

  function ensureMainModule() {
    if (!mainModulePromise) {
      mainModulePromise = (async () => {
        const module = await import("../pkg/frankenmermaid.js");
        if (module.default) await module.default();
        return module;
      })().catch((error) => {
        mainModulePromise = null;
        throw error;
      });
    }
    return mainModulePromise;
  }

  async function renderOnMain(requestId, input) {
    try {
      const module = await ensureMainModule();
      if (disposed || requestId !== liveRequestId) return;
      // Allow input/paint events before the synchronous fallback. This cannot interrupt WASM
      // once rendering starts; queued obsolete inputs are discarded before they enter it.
      await new Promise((resolve) => setTimeout(resolve, 0));
      if (disposed || requestId !== liveRequestId) return;
      statusEl.textContent = "main-thread SVG fallback — rendering is synchronous";
      const response = module.workerHandleMessage(JSON.stringify({ kind: "render", requestId, input }));
      receive(response == null ? { kind: "noReply", requestId } : JSON.parse(response));
    } catch (error) {
      if (disposed || requestId !== liveRequestId) return;
      statusEl.textContent = "render unavailable — edit the source to retry";
      receive({ kind: "failed", requestId, reason: String(error.message || error) });
    }
  }

  function fallBack(reason) {
    if (disposed || mainThread) return;
    const failedWorker = worker;
    worker = null; // Ignore late events before terminating or starting the alternate renderer.
    workerReady = false;
    clearTimeout(initTimer);
    initTimer = null;
    if (failedWorker) failedWorker.terminate();
    mainThread = true;
    canvasEl.remove();
    statusEl.textContent = "starting main-thread SVG fallback…";
    log(`worker unavailable; using main-thread SVG: ${reason}`, "warn");
    render();
  }

  function render() {
    if (disposed) return;
    // Source edits and undo/redo can change the textarea without dispatching an input event.
    deckEditor?.sourceChanged();
    const previousId = liveRequestId;
    const requestId = nextRequestId++;
    liveRequestId = requestId;
    startedAt = performance.now();
    if (sourceEditor) {
      void sourceEditor.render(srcEl.value);
    } else if (mainThread) {
      void renderOnMain(requestId, srcEl.value);
    } else if (workerReady) {
      try {
        if (previousId) worker.postMessage({ kind: "cancel", requestId: previousId });
        worker.postMessage({ kind: "render", requestId, input: srcEl.value });
      } catch (error) {
        fallBack(error.message || error);
      }
    }
    // Before readiness, remember only the latest edit. The ready handler reads the current text.
  }

  function startWorker() {
    if (typeof Worker === "undefined") {
      fallBack("Worker API not supported");
      return;
    }
    try {
      const instance = new Worker(new URL("./fm-render.worker.js", import.meta.url), { type: "module" });
      worker = instance;
      instance.onmessage = (event) => {
        if (disposed || worker !== instance) return;
        const msg = event.data;
        if (!msg || typeof msg !== "object") {
          fallBack("invalid worker response");
          return;
        }
        if (msg.kind === "ready") {
          if (workerReady) return;
          if (msg.target !== "offscreenInWorker" && msg.target !== "svgInWorker") {
            fallBack(`unsupported worker target: ${msg.target}`);
            return;
          }
          clearTimeout(initTimer);
          initTimer = null;
          workerReady = true;
          statusEl.textContent = `worker ready — chose ${msg.requested}, running ${msg.target}`;
          if (msg.target !== "offscreenInWorker") canvasEl.remove();
          if (msg.fallbackReason) log(msg.fallbackReason, "warn");
          render();
          return;
        }
        // Initialization errors have no render requestId and must be handled before stale checks.
        if (msg.kind === "failed" && (!workerReady || msg.requestId == null)) {
          fallBack(msg.reason || "initialization failed");
          return;
        }
        receive(msg);
      };
      instance.onerror = (event) => {
        if (worker === instance) fallBack(event.message || "worker crashed");
      };
      instance.onmessageerror = () => {
        if (worker === instance) fallBack("worker response could not be decoded");
      };

      const capabilities = {
        offscreenCanvas: typeof OffscreenCanvas !== "undefined",
        worker: true,
        canvasTransferred: false,
      };
      let transferred = null;
      if (capabilities.offscreenCanvas && typeof canvasEl.transferControlToOffscreen === "function") {
        try {
          transferred = canvasEl.transferControlToOffscreen();
          capabilities.canvasTransferred = true;
        } catch (error) {
          log(`transferControlToOffscreen failed, falling back to SVG in worker: ${error}`, "warn");
        }
      }
      initTimer = setTimeout(() => {
        if (worker === instance && !workerReady) fallBack("worker initialization timed out");
      }, INIT_TIMEOUT_MS);
      instance.postMessage(
        { kind: "init", moduleUrl: MODULE_URL, capabilities, canvas: transferred },
        transferred ? [transferred] : [],
      );
    } catch (error) {
      fallBack(error.message || error);
    }
  }

  // No debounce: this sample exercises supersession rather than hiding it behind a timer.
  srcEl.addEventListener("input", render);
  document.getElementById("edit-source")?.addEventListener("click", async (event) => {
    const button = event.currentTarget;
    button.disabled = true;
    try {
      const { mountSourceEditor } = await import("./fm-source-editor.js");
      if (disposed) return;
      sourceEditor = mountSourceEditor({
        sourceEl: srcEl, outEl, panelEl: document.getElementById("source-editor"),
        loadModule: ensureMainModule, onChange: render,
        workerOptions: { moduleUrl: MODULE_URL },
      });
      // This is an explicit mode change, not a worker failure. Editing needs addressable SVG.
      const previousWorker = worker;
      worker = null;
      workerReady = false;
      clearTimeout(initTimer);
      if (previousWorker) previousWorker.terminate();
      mainThread = true;
      canvasEl.remove();
      statusEl.textContent = "SVG source editor — worker-first; actual rendering target is reported below";
      render();
    } catch (error) {
      button.disabled = false;
      log(`source editor unavailable: ${error.message || error}`, "err");
    }
  });
  document.getElementById("edit-deck")?.addEventListener("click", async (event) => {
    const button = event.currentTarget;
    button.disabled = true;
    try {
      if (!deckEditor) {
        const { mountDeckEditor } = await import("./fm-deck-editor.js");
        if (disposed) return;
        deckEditor = mountDeckEditor({
          sourceEl: srcEl, panelEl: document.getElementById("deck-editor"),
          loadModule: ensureMainModule, workerOptions: { moduleUrl: MODULE_URL },
        });
      }
      // Keep the normal diagram/source preview alive; the presentation has its own worker
      // and sandboxed frame, but both remain tied to this one authoritative source.
      await deckEditor.open();
    } catch (error) {
      if (!disposed) log(`presentation unavailable: ${error.message || error}`, "err");
    } finally {
      if (!disposed) button.disabled = false;
    }
  });
  globalThis.addEventListener("pagehide", (event) => {
    if (event.persisted) return; // A back/forward-cache restore resumes this instance.
    disposed = true;
    sourceEditor?.dispose();
    deckEditor?.dispose();
    clearTimeout(initTimer);
    if (worker) worker.terminate();
    worker = null;
  });
  startWorker();
</script>
