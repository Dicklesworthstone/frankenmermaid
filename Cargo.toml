[workspace]
members = [
    "crates/fm-core",
    "crates/fm-parser",
    "crates/fm-layout",
    "crates/fm-render-svg",
    "crates/fm-render-canvas",
    "crates/fm-render-term",
    "crates/fm-wasm",
    "crates/fm-cli",
    "crates/fm-regression-harness",
]
default-members = ["crates/fm-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/Dicklesworthstone/frankenmermaid"
homepage = "https://github.com/Dicklesworthstone/frankenmermaid"

[workspace.dependencies]
fm-core = { path = "crates/fm-core", version = "0.2.0" }
fm-parser = { path = "crates/fm-parser", version = "0.2.0" }
fm-layout = { path = "crates/fm-layout", version = "0.2.0" }
fm-render-svg = { path = "crates/fm-render-svg", version = "0.2.0" }
fm-render-canvas = { path = "crates/fm-render-canvas", version = "0.2.0" }
fm-render-term = { path = "crates/fm-render-term", version = "0.2.0" }
fm-wasm = { path = "crates/fm-wasm", version = "0.2.0" }
franken-kernel = "0.3.4"
fnx-runtime = { git = "https://github.com/Dicklesworthstone/franken_networkx.git", rev = "cb8bdb590573b9de5ddbc26b948279057ac4049e", default-features = false }
fnx-classes = { git = "https://github.com/Dicklesworthstone/franken_networkx.git", rev = "cb8bdb590573b9de5ddbc26b948279057ac4049e", default-features = false }
fnx-algorithms = { git = "https://github.com/Dicklesworthstone/franken_networkx.git", rev = "cb8bdb590573b9de5ddbc26b948279057ac4049e", default-features = false }
fnx-views = { git = "https://github.com/Dicklesworthstone/franken_networkx.git", rev = "cb8bdb590573b9de5ddbc26b948279057ac4049e", default-features = false }

anyhow = "1.0.102"
chumsky = { version = "0.10", default-features = false, features = ["std"] }
# `color` is DROPPED, `suggestions` and the rest of the defaults are KEPT (bd-kpgs next lever).
#
# The worst certified vs-mermaid ratio in docs/PERF_LEDGER.md is 90.86x, and its own counted
# mechanism records that every arm "started zero render workers" -- it measures CLI process
# lifecycle, not rendering. Its profile-first attribution is dominated by one-time process setup:
# kernel ELF/page-fault 5.87% + 5.78%, Clap value parsing 3.82%, Clap command construction 3.52%,
# and dynamic-loader symbol lookup 2.69% + 2.51%. Three of those five are a function of how much
# code is linked in and how large the Command tree is.
#
# clap's default `color` feature pulls SIX crates into the link -- anstream, anstyle-parse,
# anstyle-query, colorchoice, is_terminal_polyfill and utf8parse -- purely to ANSI-style clap's own
# help and error text. (`anstyle` itself stays; clap_builder depends on it directly.)
#
# It costs nothing here that anyone can see, because the CLI does not use it. `ColorChoice` in
# fm-cli is the CLI's OWN enum and `diff_use_colors` decides via `std::io::IsTerminal`, so the
# `--color` flag and every coloured diff are untouched. The only behavioural delta is that clap's
# help and error output is no longer ANSI-styled.
#
# `suggestions` is deliberately RETAINED even though `strsim` is the other droppable crate: it is
# what turns a mistyped subcommand into "did you mean", and typo help is worth a crate.
clap = { version = "4.5.60", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
] }
js-sys = "0.3.85"
rustc-hash = "2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.149"
thiserror = "2.0.18"
nalgebra = "0.33"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
wasm-bindgen = "0.2.108"
web-sys = { version = "0.3.85", features = ["CanvasRenderingContext2d", "EventTarget", "HtmlCanvasElement", "OffscreenCanvas", "TextMetrics"] }
# `std::time::Instant::now()` PANICS on wasm32-unknown-unknown ("time not implemented on this
# platform"), which under `panic = "abort"` lowers to an `unreachable` trap — every browser
# render call that timed a pipeline stage aborted with `RuntimeError: unreachable` (GH#3).
# web-time is a drop-in: it re-exports `std::time` off-wasm and backs Instant with
# `performance.now()` on wasm32-unknown-unknown.
web-time = "1.1.0"
good_lp = { version = "1.15.0", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Native release builds optimize the hot pipeline crates for SPEED (opt-level=3), not the
# workspace-default size ("z"). The native CLI is not size-constrained, and opt="z" disables
# the inlining/vectorization that the number-formatting and byte-scan hot paths depend on
# (measured: the opt=3 profharness consistently beats the opt="z" bench for identical code).
# The wasm build (build-wasm.sh) overrides each of these back to "z" via `--config` so the
# wasm bundle stays small. fm-layout has used this split since before; extended to the rest.
[profile.release.package.fm-layout]
opt-level = 3

[profile.release.package.fm-parser]
opt-level = 3

[profile.release.package.fm-render-svg]
opt-level = 3

[profile.release.package.fm-core]
opt-level = 3

[profile.dev.package.fm-layout]
opt-level = 3
